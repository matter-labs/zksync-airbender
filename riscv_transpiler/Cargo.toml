[package]
name = "riscv_transpiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
common_constants = { workspace = true }
field = { workspace = true }
blake2s_u32 = { workspace = true }
ruint = { version = "1.16" }
worker = { workspace = true }
serde = { workspace = true }
seq-macro = { workspace = true }
inferno = { workspace = true, optional = true }
addr2line_new = { workspace = true, optional = true }
object = { workspace = true, optional = true }
serde-big-array = "*"
keccak = "*"

dynasmrt = { version = "5", optional = true }
capstone = {version = "0.13", optional = true }

[features]
jit = ["dynasmrt", "capstone"]
flamegraph = ["dep:inferno", "dep:addr2line_new", "dep:object"]
# Register-timestamp tracking for the JIT (8 RISC-V values always live in host GPRs):
#   default (off): "packed" scheme — one store per cycle of the cycle's base timestamp into
#                  a (32 x 33 x 33) u64 array in MachineState; per-register timestamps are
#                  reconstructed by scanning it (MachineState::reconstruct_register_timestamps).
#   xmm_ts       : keep the 8 mapped registers' timestamps live in XMM lanes (xmm6/7/13/14)
#                  via `pinsrq` instead (the previous default; kept for A/B comparison).
xmm_ts = []
# Fuse runs of consecutive same-base word loads/stores (immediate stride +4) in the eager
# (default, packed-timestamp) JIT path into wide vector memory/trace stores. The merge width
# (max group size, one of 2/4/8) is chosen at runtime via the RISCV_MERGE_WINDOW env var
# (default 8). BLINDLY ASSUMES no jump target lands between the merged accesses. No effect
# under `xmm_ts`. See `emit_merged_word_run` in src/jit/impls.rs.
mem_merge = []
default = ["jit"]

[dev-dependencies]
test_utils = { workspace = true }
lib-rv32-asm = {git = "https://github.com/shamatar/lib-rv32.git" }
hex = "*"
serial_test = "*"
