[package]
name = "riscv_transpiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
common_constants = { workspace = true }
field = { workspace = true }
blake2s_u32 = { workspace = true }
ruint = { version = "1.16" }
worker = { workspace = true }
serde = { workspace = true }
seq-macro = { workspace = true }
inferno = { workspace = true, optional = true }
addr2line_new = { workspace = true, optional = true }
object = { workspace = true, optional = true }
serde-big-array = "*"
keccak = "*"

dynasmrt = { version = "5", optional = true }
capstone = {version = "0.13", optional = true }

[features]
jit = ["dynasmrt", "capstone"]
flamegraph = ["dep:inferno", "dep:addr2line_new", "dep:object"]
# Register-allocation experiment selector for the timestamp-tracking JIT:
#   default (off): 4 RISC-V values in host GPRs (a0..a3), their timestamps in the 4
#                  freed GPRs (r14/r15/rbx/rbp) via move-eliminated `mov`.
#   ts_in_xmm     : 8 RISC-V values in host GPRs (a0..a4/a6/t3/a5), their timestamps
#                  live in XMM lanes (xmm6/7/13/14) via `pinsrq`.
ts_in_xmm = []
default = ["jit"]

[dev-dependencies]
test_utils = { workspace = true }
lib-rv32-asm = {git = "https://github.com/shamatar/lib-rv32.git" }
hex = "*"
serial_test = "*"
