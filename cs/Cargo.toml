[package]
name = "cs"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
field.workspace = true
serde.workspace = true
blake2s_u32 = { workspace = true, optional = true }
fft = { workspace = true, optional = true }
common_constants = { workspace = true }
riscv_transpiler = { workspace = true, optional = true }
smallvec = {version = "1.13", features = ["const_generics", "const_new", "serde"], optional = true }
proc-macro2 = {version = "1", optional = true }
quote = {version = "1", optional = true }
seq-macro = { workspace = true, optional = true }
arrayvec = { workspace = true, optional = true }
serde_with = { version = "*", optional = true }
serde_json = { version = "*", optional = true }
rayon =  { version = "1", optional = true }
type-map = { version = "0.5", optional = true }

[dev-dependencies]
test_utils = { workspace = true }

[features]
compiler = ["blake2s_u32", "fft", "smallvec", "proc-macro2", "quote", "seq-macro", "serde_json", "rayon", "type-map", "serde_with", "arrayvec", "riscv_transpiler"]
# Will perform witness evaluation in synthesis functions
debug_evaluate_witness = []
# When enabled, the crate will print detailed debug logs.
debug_logs = []
# Use the original arithmetization of the Blake2s round function delegation (3-column lookup
# tables only) instead of the default `wider_tables` one. Only selects the implementation.
legacy_blake_round_function = []

default = ["compiler"]

[[test]]
name = "delegation_zero_timestamp"
path = "tests/delegation_zero_timestamp.rs"
required-features = ["compiler"]

[lints]
workspace = true
