[package]
name = "verifier_generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cs = { workspace = true, features = ["compiler"] }
prover = { workspace = true, features = ["prover"] }
verifier_common = { workspace = true }
serde.workspace = true
syn = { version = "2", features = ["extra-traits", "printing", "full"]}
quote = { version = "1" }
proc-macro2 = "1"
serde_json = "*"

[features]
default = ["security_80"]
no_caches = ["verifier_common/no_caches"]
# When set, the generated verifier reads WHIR intermediate-oracle leaves in
# evaluation form (fold_coset). Default (feature off) is coefficient form.
# Only drives this crate's `cfg!(feature = "eval_leaves")` token emission; the
# prover sets its matching feature independently (see gkr_test.sh --encoding).
eval_leaves = []
security_80 = ["verifier_common/security_80"]
security_100 = ["verifier_common/security_100"]

[dev-dependencies]
test_utils = { workspace = true }
serial_test = "3"
rayon = "1"
verifier_common = { workspace = true, features = ["proof_utils"] }
