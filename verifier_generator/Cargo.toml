[package]
name = "verifier_generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cs = { workspace = true, features = ["compiler"] }
prover = { workspace = true, features = ["prover"] }
verifier_common = { workspace = true }
serde.workspace = true
syn = { version = "2", features = ["extra-traits", "printing", "full"]}
quote = { version = "1" }
proc-macro2 = "1"
serde_json = "*"

[features]
no_caches = ["verifier_common/no_caches"]
# When set, the generated verifier reads WHIR intermediate-oracle leaves in
# evaluation form (fold_coset). Default (feature off) is coefficient form, the
# only encoding the CPU prover commits (its `eval_leaves` feature was removed);
# only the GPU prover (`gpu_whir eval_leaves`) can still produce the other one.
eval_leaves = []

[dev-dependencies]
test_utils = { workspace = true }
rayon = "1"
verifier_common = { workspace = true, features = ["proof_utils"] }
