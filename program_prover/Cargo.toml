[package]
name = "program_prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
circuit_common = { workspace = true }
common_constants = { workspace = true }
execution_prover = { workspace = true }
full_statement_verifier = { workspace = true, features = ["host_utils", "proof_utils"] }
prover = { workspace = true, features = ["prover"] }
riscv_transpiler = { workspace = true }
setups = { workspace = true, features = ["witness_eval_fn"] }
trace_and_split = { workspace = true }
verifier_common = { workspace = true }

bincode = { version = "1.3" }
# Only for the `l1` compression path (reads the zlib-compressed bincode caches
# the prover_examples recursion tests write).
flate2 = { version = "*", optional = true }
serde = { workspace = true }
serde_json = "*"

[dev-dependencies]
test_utils = { workspace = true }

serial_test = "3"

[[bin]]
name = "l1_compression"
required-features = ["l1"]

[features]
verifiers = ["full_statement_verifier/verifiers"]
# L1 compression path: prove the recursion stable point down to ONE Proth120
# packed proof (pulls in prover's test harness for the Proth120 witness path).
l1 = ["prover/test", "prover/bincode", "dep:flate2"]
# When enabled, the crate will print detailed debug logs.
debug_logs = []
# Will perform satisfiability tests on witness
gkr_self_checks = ["prover/gkr_self_checks"]
# Will evaluate quotient on main domain for satisfiability checks
debug_satisfiable = ["prover/debug_satisfiable"]
# Print logs related to timings only.
timing_logs = []

default = ["timing_logs", "verifier_common/proof_utils", "gkr_self_checks"]
