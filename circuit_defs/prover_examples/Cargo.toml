[package]
name = "prover_examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
common_constants = { workspace = true }
prover = { workspace = true, features = ["prover"] }
riscv_transpiler = { workspace = true }
trace_and_split = { workspace = true }
setups = { workspace = true, features = ["witness_eval_fn"] }
circuit_common = { workspace = true }
serde = { workspace = true }
serde_json = "*"
bincode = { version = "1.3" }
itertools = { workspace = true }
verifier_common = { workspace = true, default-features = false }
full_statement_verifier = { workspace = true, default-features = false, features = ["proof_utils", "replace_csr", "host_utils"]}

# dependencies for gpu
gpu_prover = { workspace = true, optional = true }
nvtx = { version = "1", optional = true }
cs = { workspace = true, optional = true }

[dev-dependencies]
test_utils = { workspace = true }
lib-rv32-asm = {git = "https://github.com/shamatar/lib-rv32.git"}
serial_test = "3"
flate2 = "*"

[features]
verifiers = ["verifier_common/no_inline", "full_statement_verifier/verifiers", "full_statement_verifier/security_80"]
security_80 = ["verifier_common/security_80"]
security_100 = ["verifier_common/security_100"]
# When enabled, the crate will print detailed debug logs.
debug_logs = []
# Will perform satisfiability tests on witness
gkr_self_checks = ["prover/gkr_self_checks"]
# Will evaluate quotient on main domain for satisfiability checks
debug_satisfiable = ["prover/debug_satisfiable"]
# Print logs related to timings only.
timing_logs = []
# verifiers = ["full_statement_verifier/verifiers"]

default = ["timing_logs", "security_80", "verifier_common/proof_utils", "gkr_self_checks"]

gpu = ["gpu_prover", "nvtx", "cs"]
