[package]
name = "gpu_gkr_compiler"
version.workspace = true
edition = "2024"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cs = { workspace = true, features = ["compiler"] }
field.workspace = true
gkr_eval_ir.workspace = true
gpu_gkr_model.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gkr-forward-artifact"
path = "src/bin/gkr-forward-artifact.rs"

[dev-dependencies]
cs = { workspace = true, features = ["test-support"] }
