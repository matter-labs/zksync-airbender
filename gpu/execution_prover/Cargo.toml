[package]
name = "gpu_execution_prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
common_constants = { workspace = true }
cs = { workspace = true, features = ["compiler"] }
execution_prover = { workspace = true }
execution_prover_model = { workspace = true }
fft = { workspace = true }
field = { workspace = true }
# Select proof-of-work features through this crate.
gpu_circuit_prover = { workspace = true, default-features = false }
gpu_core = { workspace = true }
gpu_gkr = { workspace = true }
gpu_prover_context = { workspace = true }
gpu_trace = { workspace = true }
prover = { workspace = true, features = ["prover"] }
riscv_transpiler = { workspace = true, features = ["jit"] }
setups = { workspace = true }
verifier_common = { workspace = true }
worker = { workspace = true }

clap = { workspace = true, optional = true }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
csv = { version = "1", optional = true }
era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"
itertools = "0.14"
log = "0.4.29"
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
memory_sweep = ["dep:clap", "dep:csv", "dep:serde", "dep:serde_json"]
default = ["deterministic_pow"]
deterministic_pow = [
    "gpu_circuit_prover/deterministic_pow",
    "execution_prover/deterministic_pow",
]
eval_leaves = ["gpu_circuit_prover/eval_leaves"]
verifiers = ["full_statement_verifier/verifiers"]

[dev-dependencies]
cpu_execution_prover = { workspace = true }
execution_prover = { workspace = true, features = ["test_utils"] }
full_statement_verifier = { workspace = true, features = [
    "host_utils",
    "proof_utils",
] }
program_prover = { workspace = true, features = [
    "gkr_self_checks",
    "timing_logs",
] }

bincode = "1.3"
env_logger = "0.11"
flate2 = "*"
serde = { workspace = true }
serde_json = "*"

[[test]]
name = "execution"
path = "tests/execution.rs"

[[test]]
name = "program"
path = "tests/program.rs"
required-features = ["verifiers"]

[[test]]
name = "commitment_parity"
path = "tests/commitment_parity.rs"
required-features = ["deterministic_pow"]

[[bin]]
name = "gpu_memory_sweep"
path = "src/bin/gpu_memory_sweep.rs"
required-features = ["memory_sweep"]
