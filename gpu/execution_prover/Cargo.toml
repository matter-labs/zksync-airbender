[package]
name = "gpu_execution_prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gpu_circuit_prover = { workspace = true, default-features = false }
gpu_prover_context = { workspace = true }
gpu_trace = { workspace = true }
gpu_gkr = { workspace = true }
gpu_core = { workspace = true }

execution_prover = { workspace = true, default-features = false }
execution_prover_model = { workspace = true }

cs = { workspace = true, features = ["compiler"] }
field = { workspace = true }
prover = { workspace = true, features = ["prover"] }
setups = { workspace = true }
trace_and_split = { workspace = true }

common_constants = { workspace = true }
fft = { workspace = true }
riscv_transpiler = { workspace = true, features = ["jit"] }
verifier_common = { workspace = true }
worker = { workspace = true }

era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"

crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
# collect_array requires itertools 0.14.
itertools = "0.14"
log = "0.4.29"
rayon = "*"
type-map = "0.5"

clap = { workspace = true, optional = true }
csv = { version = "1", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
memory_sweep = ["dep:clap", "dep:csv", "dep:serde", "dep:serde_json"]
default = ["deterministic_pow"]
deterministic_pow = [
    "gpu_circuit_prover/deterministic_pow",
    "execution_prover/deterministic_pow",
]
eval_leaves = ["gpu_circuit_prover/eval_leaves"]
verifiers = ["verifier_common/no_inline", "full_statement_verifier/verifiers"]

[dev-dependencies]
env_logger = "0.11"
execution_prover = { workspace = true, default-features = false, features = ["test_utils"] }
program_prover = { workspace = true, default-features = false, features = [
    "timing_logs",
    "gkr_self_checks",
] }
full_statement_verifier = { workspace = true, default-features = false, features = [
    "proof_utils",
    "host_utils",
] }
cpu_execution_prover = { workspace = true, default-features = false }
bincode = "1.3"
flate2 = "*"
serde = { workspace = true }
serde_json = "*"

[[test]]
name = "execution"
path = "tests/execution.rs"

[[test]]
name = "program"
path = "tests/program.rs"
required-features = ["verifiers"]

[[test]]
name = "commitment_parity"
path = "tests/commitment_parity.rs"
required-features = ["deterministic_pow"]

[lints.rust]
# Recognizes legacy test gates; this crate does not set no_cuda.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(no_cuda)'] }

[[bin]]
name = "gpu_memory_sweep"
path = "src/bin/gpu_memory_sweep.rs"
required-features = ["memory_sweep"]
