[package]
name = "circuit_prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build/main.rs"

[dependencies]
blake2s_u32 = { workspace = true }
circuit_common = { workspace = true }
common_constants = { workspace = true }
cs = { workspace = true, features = ["compiler"] }
fft = { workspace = true }
field = { workspace = true }
prover = { workspace = true, features = ["prover"] }
riscv_transpiler = { workspace = true, features = ["jit"] }
setups = { workspace = true }
trace_and_split = { workspace = true }
verifier_common = { workspace = true }
worker = { workspace = true }

gpu_core = { workspace = true }
gpu_cub = { workspace = true }
gpu_hash = { workspace = true }
gpu_ntt = { workspace = true }
gpu_ops = { workspace = true }
gpu_gkr_model = { workspace = true }

era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"

crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
# Pinned to 0.14 (matching the dev-dep): the execution workers use
# `Itertools::collect_array`, which only exists in 0.14. The previous `"*"`
# under-constrained the lib, so building circuit_prover as a dependency could
# resolve the older 0.13 in the workspace lock and fail to find the method.
itertools = "0.14"
log = "0.4.29"
rayon = "*"
type-map = "0.5"

[features]
default = ["security_80", "deterministic_pow"]
# Compiles the GKR eval-ISA bench kernels (native/bench/) into
# circuit_prover_native and enables the cfg(all(test, feature = "bench"))
# harness modules. Never enabled in production builds.
bench = []
deterministic_pow = ["prover/deterministic_pow", "gpu_hash/deterministic_pow"]
log_gpu_mem_usage = []
security_80 = ["verifier_common/security_80"]
security_100 = ["verifier_common/security_100"]
test_no_inline = ["field/no_inline"]

[build-dependencies]
gpu_native_build = { workspace = true }

[dev-dependencies]
env_logger = "0.11"
itertools = "0.14"
rand = "0.9"
serial_test = "3"
blake2s_u32 = { workspace = true }
serde = { workspace = true }
serde_json = "*"
# Consumed only by the cfg(all(test, feature = "bench")) stage-3 bench
# harness (prover::gkr::forward::bench_interp); dev-deps cannot be
# feature-gated, so they build for all test profiles.
gkr_design_space = { path = "../../gkr_design_space" }
gkr_eval_isa = { path = "../../gkr_eval_isa" }
