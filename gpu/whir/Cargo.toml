[package]
name = "gpu_whir"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "gpu_whir_native"

[dependencies]
gpu_core = { workspace = true }
gpu_ntt = { workspace = true }
gpu_ops = { workspace = true }
gpu_hash = { workspace = true }
gpu_cub = { workspace = true }
gpu_prover_context = { workspace = true }
gpu_trace = { workspace = true }
gpu_gkr = { workspace = true }

era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"

field = { workspace = true }
fft = { workspace = true }
# prover is a production dependency: the WHIR-oracle parity + query test-support
# surface (`#[doc(hidden)] pub`, reached by the apex e2e suite) is permanently
# compiled and references prover types (`MerkleTreeCapVarLength`,
# `extension_field_from_base_coeffs`, the transcript/commitment helpers). This is
# the gpu_gkr precedent. Because prover is a normal dep, gpu_whir owns the
# `prover/deterministic_pow` forward leg (see [features]).
prover = { workspace = true, features = ["prover"] }

itertools = "0.14"

[features]
# Commit recursive WHIR oracle leaves in evaluation form instead of the default
# coefficient form (#279). PROTOCOL-level: the generated verifier must be built
# with the matching encoding (verifier_generator `eval_leaves`). Single cfg site:
# `fold/schedule/round_phases.rs`. The GPU commit transform is native, independent
# of `prover`/`gpu_hash`.
eval_leaves = []
# GPU PoW determinism (matches the host verifier for proof parity). The PoW
# search kernel lives in gpu_hash; the host-side determinism is prover's — and
# since gpu_whir depends on prover as a normal dependency, it forwards both legs
# so the apex only needs `gpu_whir/deterministic_pow`.
deterministic_pow = ["prover/deterministic_pow", "gpu_hash/deterministic_pow"]
# Exposes the WHIR-oracle parity + query/debug test-support surface (the
# recursive-oracle `from_monomial_coeffs`/`get_tree_cap`/`query_for_folded_index`
# helpers and the `fold::debug` checkpoint builders) to downstream crates' tests;
# not compiled into the normal library. Gated `#[cfg(any(test, feature =
# "test-utils"))]` so the crate's own tests need no feature; enabled from
# `gpu_circuit_prover`'s [dev-dependencies]. Same precedent as the `prover` crate.
test-utils = []

[build-dependencies]
gpu_native_build = { workspace = true }

[dev-dependencies]
# test-utils unlocks prover's `commit_single_ext_poly_*_for_test` CPU references
# (gated `#[cfg(any(test, feature = "test-utils"))]`). Cargo unions this with the
# normal `["prover"]` feature for the test build (mirrors the apex).
prover = { workspace = true, features = ["test-utils"] }
worker = { workspace = true }
rand = "0.9"
