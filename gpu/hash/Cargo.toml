[package]
name = "gpu_hash"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "gpu_hash_native"

[features]
# Compiles `native/hash.cu`'s PoW kernel with `AB_DETERMINISTIC_POW`. Enabled
# by `circuit_prover`'s `deterministic_pow` feature so the GPU PoW search matches
# the host verifier (required for proof parity).
deterministic_pow = []

[dependencies]
gpu_core = { workspace = true }
gpu_ops = { workspace = true }
field = { workspace = true }
era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"

[dev-dependencies]
gpu_core = { workspace = true }
worker = { workspace = true }
blake2s_u32 = { workspace = true }
transcript = { workspace = true }
# Dev-only: the transcript parity test verifies the GPU kernels against the host
# `prover::transcript::Blake2sTranscript` reference. Production `gpu_hash` and all
# downstream crates depend only on gpu_core/gpu_ops — this does not leak.
prover = { workspace = true, features = ["prover"] }
itertools = "0.14"
rand = "0.9"
serial_test = "3"

[build-dependencies]
gpu_native_build = { workspace = true }
