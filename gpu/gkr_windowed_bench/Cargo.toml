[package]
name = "gpu_gkr_windowed_bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "gpu_gkr_windowed_bench_native"
default-run = "gpu_gkr_windowed_bench"

[features]
default = []
artifact-gen = [
    "dep:cs",
    "dep:gkr_eval_ir",
    "dep:gpu_gkr_compiler",
    "dep:serde_json",
]

[dependencies]
bincode = "1.3.3"
clap = { workspace = true }
era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"
field = { workspace = true }
serde = { workspace = true }

cs = { workspace = true, features = ["compiler"], optional = true }
gkr_eval_ir = { workspace = true, optional = true }
gpu_gkr_compiler = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
gpu_native_build = { workspace = true }

[[bin]]
name = "generate_add_sub_layer0"
path = "src/bin/generate_add_sub_layer0.rs"
required-features = ["artifact-gen"]
