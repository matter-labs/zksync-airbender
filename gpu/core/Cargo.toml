[package]
name = "gpu_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "gpu_core_native"

[dependencies]
cs = { workspace = true, features = ["compiler"] }
field = { workspace = true }
fft = { workspace = true }
era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"
itertools = { workspace = true }
log = "0.4"

[features]
# Builds the field micro-benchmark (`benches/field.rs`) + its CUDA archive
# (`native/bench/field.cu` → `gpu_core_bench_native`).
bench = []

[dev-dependencies]
criterion = "0.5"
era_criterion_cuda = "0.2"

[build-dependencies]
cc = "1"
gpu_native_build = { workspace = true }

[[bench]]
name = "field"
harness = false
required-features = ["bench"]
