[package]
name = "gpu_gkr"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "gpu_gkr_native"

[features]
default = []
dr_tail_trace = []
gpu_component_differential_test = []
task8_continuation_differential_test = []

[dependencies]
gpu_core = { workspace = true }
gpu_ops = { workspace = true }
gpu_hash = { workspace = true }
gpu_prover_context = { workspace = true }
gpu_trace = { workspace = true }
gpu_gkr_model = { workspace = true }
gpu_gkr_compiler = { workspace = true }
gkr_eval_ir = { workspace = true }

era_cudart = "=0.156.0"
era_cudart_sys = "=0.156.0"

cs = { workspace = true, features = ["compiler"] }
prover = { workspace = true, features = ["prover"] }
field = { workspace = true }
serde_json = "1"

[build-dependencies]
gpu_native_build = { workspace = true }

[dev-dependencies]
worker = { workspace = true }
fft = { workspace = true }
rand = "0.9"
itertools = "0.14"

[[bin]]
name = "generate_windowed_continuation_golden"
path = "src/bin/generate_windowed_continuation_golden.rs"
