# GKR verifier — its own Foundry project (compiled with via_ir; the hand-written verifier
# assembly needs the IR backend's stack spilling). `GkrVerifier.sol` is generated by
# `cargo test -p verifier_evm --test generate_contracts`. Build with `forge build`; the two_tx
# project reads out/GkrVerifier.sol/GKRVerifier.json::deployedBytecode.
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
src = "src"
out = "out"
# Legacy backend (no via_ir): this is the validated codegen path for the hand-written GKR
# verifier assembly (the "memory-safe" fallback + hand-placed heap). via_ir compiles too but
# was never run end-to-end; legacy matches the harness that verified the real proof.
via_ir = false
optimizer = true
optimizer_runs = 1
