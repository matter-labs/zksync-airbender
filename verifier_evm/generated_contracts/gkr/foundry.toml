# GKR verifier — its own Foundry project (compiled with via_ir; the hand-written verifier
# assembly needs the IR backend's stack spilling). `GkrVerifier.sol` is generated by
# `cargo test -p verifier_evm --test generate_contracts`. Build with `forge build`; the two_tx
# project reads out/GkrVerifier.sol/GKRVerifier.json::deployedBytecode.
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
src = "src"
out = "out"
# via_ir backend. The GKR verifier's hand-written assembly stays `("memory-safe")` so the IR
# backend can spill freely (plain assembly → stack-too-deep). The one requirement: via_ir places
# its stack-spill slots at fixed low offsets [0x80, MINIMUM_FREE_HEAP_PTR), so the verifier's two
# live low pointers (P_PTR, CIRCUIT_PTR) were moved into the spill-safe region above
# MINIMUM_FREE_HEAP_PTR (see the layout note in gkr.sol) — otherwise the spills silently clobber
# them and the committed state comes out wrong. Validated end-to-end by the two-tx cross-check.
# optimizer_runs = 1: the GKR tx is bounded by the EIP-7623 calldata floor (execution gas <
# floor), so lowering execution gas via a higher runs count does NOT reduce total tx gas — it
# only enlarges the bytecode. runs=1 gives the smallest bytecode at identical on-chain gas.
via_ir = true
optimizer = true
optimizer_runs = 1
