# Merged single-contract GKR+WHIR verifier — its own Foundry project. `GkrWhirVerifier.sol` is
# generated by `cargo test -p verifier_evm --test generate_contracts`; the single-transaction
# calldata (`gkr ‖ whir_stream`) by `--test flatten_calldata` into ../../debug_data. Same
# compiler settings as the standalone GKR project: via_ir (the memory-safe assembly needs the IR
# backend's stack spilling), optimizer_runs = 1 (the tx is EIP-7623 calldata-floor-bound, so a
# higher runs count only enlarges the bytecode). Run: `forge test`.
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
src = "src"
out = "out"
via_ir = true
optimizer = true
optimizer_runs = 1
fs_permissions = [
    { access = "read", path = "../../debug_data" },
]
