# Merged single-contract GKR+WHIR verifier (v0 calldata) and the Foundry tests of every merged
# render. `src/GkrWhirVerifier.sol` is generated by `cargo test -p verifier_evm --test
# generate_contracts -- --ignored`, the calldata by `--test flatten_calldata -- --ignored` into
# ../../../debug_data/l1_wrap_2p21. The tests deploy the F1, negative, control and instrumented
# renders from their own projects' out/ (build them first; ../../run_merged.sh does). via_ir (the
# memory-safe assembly needs the IR backend's stack spilling), optimizer_runs = 1 (the tx is
# calldata-floor-bound, so a higher runs count only enlarges the bytecode).
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
evm_version = "osaka"
src = "src"
out = "out"
via_ir = true
optimizer = true
optimizer_runs = 1
fs_permissions = [
    { access = "read", path = "../../../debug_data/l1_wrap_2p21" },
    { access = "read", path = "./testdata" },
    { access = "read", path = "../merged_f1/out" },
    { access = "read", path = "../negative" },
    { access = "read", path = "../instrumented" },
    { access = "read", path = "../controls" },
]
