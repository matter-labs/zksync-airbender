# WHIR verifier — its own Foundry project (via_ir). `WhirVerifier.sol` is generated by
# `AB_EVM_VERSION=2p21 cargo test -p verifier_evm --test generate_contracts -- --ignored`. Build with `forge build`; the two_tx
# project reads out/WhirVerifier.sol/WhirVerifier.json::deployedBytecode.
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
src = "src"
out = "out"
via_ir = true
optimizer = true
optimizer_runs = 10000000
