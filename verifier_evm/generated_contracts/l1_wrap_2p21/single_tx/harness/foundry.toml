# Single-transaction proxy harness. Compiles L1VerifierSingleTx + tests; the single-tx GKR/WHIR
# verifier variants (../gkr, ../gkr_negative, ../whir, generated by verifier_evm's
# generate_contracts test) and the two-tx originals (../../gkr, ../../whir) are read as compiled
# deployedBytecode from their own projects' out/ (build them first). Calldata from
# ../../../../debug_data/l1_wrap_2p21.
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
src = "src"
out = "out"
via_ir = true
optimizer = true
optimizer_runs = 200
allow_paths = ["../../two_tx"]
remappings = ["two_tx/=../../two_tx/"]
fs_permissions = [
    { access = "read", path = "../gkr" },
    { access = "read", path = "../gkr_negative" },
    { access = "read", path = "../whir" },
    { access = "read", path = "../f1/gkr" },
    { access = "read", path = "../f1/gkr_negative" },
    { access = "read", path = "../f1/whir" },
    { access = "read", path = "../f1/gkr_wrong_setup_cap" },
    { access = "read", path = "../instrumented/gkr_v0" },
    { access = "read", path = "../instrumented/gkr_f1" },
    { access = "read", path = "../instrumented/whir_v0" },
    { access = "read", path = "../instrumented/whir_f1" },
    { access = "read", path = "../../gkr" },
    { access = "read", path = "../../whir" },
    { access = "read", path = "./testdata" },
    { access = "read", path = "../../../../debug_data/l1_wrap_2p21" },
]
