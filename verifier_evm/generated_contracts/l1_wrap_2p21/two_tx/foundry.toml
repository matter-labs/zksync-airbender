# Two-transaction cross-check. Compiles only the generated GkrWhirRegistry + the test; the GKR
# and WHIR verifiers are read as already-compiled deployedBytecode from the sibling projects'
# out/ (build them first: `forge build` in ../gkr, ../gkr_negative and ../whir). Calldata is read from
# ../../../debug_data/l1_wrap_2p21 (plus the 2p22 rejection fixture). Run: `forge test`.
[profile.default]
solc_version = "0.8.36"
auto_detect_solc = false
src = "src"
out = "out"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "../gkr" },
    { access = "read", path = "../gkr_negative" },
    { access = "read", path = "../whir" },
    { access = "read", path = "../../../debug_data" },
]
