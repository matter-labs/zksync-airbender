[files]
extend-exclude = [
    "*.json",
    "*.lock",
    "*.bin",
    "*.elf",
    "*.pdf",
    "*.png",
    "*.text",
    "*.bak",
    "*.svg",
    ".git/",
    "SECURITY.md"
]

[default.extend-words]
ND = "ND"
nd = "nd"
ba = "ba"
pn = "pn"
sie = "sie"
Sie = "Sie"
tou = "tou"
leafs = "leafs"
LEAFS = "LEAFS"
INOT = "INOT"
inot = "inot"
ot = "ot"
# `transcriptNto1` in the generated Yul verifier is "transcript N-to-1", not a
# misspelling of "Not". Renaming it would desync the generator from the committed
# verifier_evm/generated_contracts/gkr/src/GkrVerifier.sol.
Nto = "Nto"

[type.asm.extend-words]
Wich = "Wich"
TRE = "TRE"
