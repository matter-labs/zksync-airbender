name = "airbender_circuits"
version = "0.1.0"
defaultTargets = ["Airbender", "GKRCompiler", "GKRProtocol", "airbender_import", "airbender_tests"]

[[require]]
name = "lean-sail"
git = "https://github.com/rems-project/lean-sail.git"
rev = "c816ea7ad03cce98d51acee252540fd4215fede8"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean.git"
rev = "1e563b9c27991b3795eb440c1ee0757edb4ce8b1"

# Keep Mathlib last so its pinned transitive dependencies take precedence.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "SailRV32"
srcDir = "generated/sail-rv32"

[[lean_lib]]
name = "Airbender"
# Kernel comparison of the complete source literals needs this virtual stack.
# The verification guard still caps physical memory and bounded resident memory.
moreLeanArgs = ["--tstack=2097152"]
needs = ["addSubJson", "jumpBranchSltJson", "unsignedMulDivJson", "shiftBinopJson", "wordMemoryJson", "subwordMemoryJson", "unifiedReducedJson", "blakeGJson", "blakeRoundJson", "bigintJson", "keccakJson", "setupSmokeJson", "setupAddSubJson", "setupBigintJson", "setupBlakeGJson", "setupKeccakJson", "setupBlakeRoundJson", "setupJumpBranchJson", "setupMulDivJson", "setupShiftBinopJson", "setupWordMemoryJson", "setupSubwordMemoryJson", "setupUnifiedJson", "setupInitsJson", "initializationJson", "keccakColumnParityJson", "keccakColumnParityCachedJson", "keccakThetaRhoJson", "keccakThetaRhoCachedJson", "keccakChi5Json", "keccakChi5CachedJson", "setupKeccakColumnParityJson", "setupKeccakThetaRhoJson", "setupKeccakChi5Json"]

[[lean_lib]]
name = "Tests"
needs = ["setupSmokeJson", "setupKeccakJson"]

