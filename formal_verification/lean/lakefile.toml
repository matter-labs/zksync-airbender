# Compiler modules follow the Review/Import/Proofs layout while retaining
# their own real input dependencies; ordinary circuit proofs keep theirs.
[[lean_lib]]
name = "GKRCompiler"
roots = ["Airbender.Proofs.GKRCompiler", "Airbender.Import.GKRCompiler", "Airbender.Import.Compiler.Arithmetic", "Airbender.Import.Compiler.ArithmeticInstances"]
globs = ["Airbender.Proofs.GKRCompiler", "Airbender.Import.GKRCompiler.+", "Airbender.Import.Compiler.Arithmetic.+", "Airbender.Import.Compiler.ArithmeticInstances"]
needs = ["gkrAddSubCachedPair", "gkrAddSubCachedIdentity", "gkrJumpBranchCachedPair", "gkrJumpBranchCachedIdentity", "gkrMulDivCachedPair", "gkrMulDivCachedIdentity", "gkrShiftBinopCachedPair", "gkrShiftBinopCachedIdentity", "gkrWordMemoryCachedPair", "gkrWordMemoryCachedIdentity", "gkrSubwordMemoryCachedPair", "gkrSubwordMemoryCachedIdentity", "gkrUnifiedCachedPair", "gkrUnifiedCachedIdentity", "gkrBigintCachedPair", "gkrBigintCachedIdentity", "gkrBlakeGCachedPair", "gkrBlakeGCachedIdentity", "gkrBlakeRoundCachedPair", "gkrBlakeRoundCachedIdentity", "gkrKeccakCachedPair", "gkrKeccakCachedIdentity"]

# Compiler modules follow the Review/Import/Proofs layout while retaining
# their own real input dependencies; ordinary circuit proofs keep theirs.
[[lean_lib]]
name = "GKRProtocol"
roots = ["Airbender.Proofs.GKRProtocol", "Airbender.Import.GKRProtocol", "Airbender.Import.Compiler.Rows"]
globs = ["Airbender.Proofs.GKRProtocol", "Airbender.Import.GKRProtocol.+", "Airbender.Import.Compiler.Rows.+"]
needs = ["gkrAddSubCachedPair", "gkrJumpBranchCachedPair", "gkrMulDivCachedPair", "gkrShiftBinopCachedPair", "gkrWordMemoryCachedPair", "gkrSubwordMemoryCachedPair", "gkrUnifiedCachedPair", "gkrBigintCachedPair", "gkrBlakeGCachedPair", "gkrBlakeRoundCachedPair", "gkrKeccakCachedPair", "compilerSourceAddSubCached", "compilerSourceJumpBranchCached", "compilerSourceMulDivCached", "compilerSourceShiftBinopCached", "compilerSourceWordMemoryCached", "compilerSourceSubwordMemoryCached", "compilerSourceUnifiedCached", "compilerSourceBigintCached", "compilerSourceBlakeGCached", "compilerSourceBlakeRoundCached", "compilerSourceKeccakCached", "compilerLookupAddSubCached", "compilerLookupJumpBranchCached", "compilerLookupMulDivCached", "compilerLookupShiftBinopCached", "compilerLookupWordMemoryCached", "compilerLookupSubwordMemoryCached", "compilerLookupUnifiedCached", "compilerLookupBigintCached", "compilerLookupBlakeGCached", "compilerLookupBlakeRoundCached", "compilerLookupKeccakCached"]

