# Workspace nextest configuration.
#
# GPU policy: tests in GPU-capable crates run in one serialized test group
# (nextest's process-per-test model
# would otherwise run them concurrently — a serial_test in-process mutex
# cannot serialize across processes, which is why the GPU crates carry no
# #[serial] annotations). This group serializes nextest runs; plain
# `cargo test` is covered by the pre-main `gpu_core::force_serial_libtest!()`
# guard at every GPU crate root. Cross-PROCESS exclusivity against other
# workloads is still the job of .agents/bin/with_gpu_lock.sh; this group only
# serializes tests within one nextest invocation.
#
# Coverage of both classifications is drift-guarded by
# gpu_core::serial_guard::tests::cpu_nextest_config_covers_all_gpu_crates.

[profile.default]
# A hang or failure must not silently truncate suite coverage: with the
# gpu-serial group one test at a time, nextest's default fail-fast would
# cancel every remaining GPU test on the first failure. Pass --fail-fast on
# the command line when iterating.
fail-fast = false

[test-groups.gpu-serial]
max-threads = 1

# CPU-only opt-out: tests in a module or test whose name starts with `cpu_`
# never touch the GPU (convention — the test author asserts this by the name), so
# they run in the default parallel group and skip both serialization and the
# per-process CUDA-init cost. First match wins: this override must stay above
# the gpu-serial one.
[[profile.default.overrides]]
filter = '(package(gpu_hash) | package(gpu_core) | package(gpu_ntt) | package(gpu_ops) | package(gpu_cub) | package(gpu_prover_context) | package(gpu_trace) | package(gpu_gkr) | package(gpu_whir) | package(gpu_circuit_prover) | package(gpu_execution_prover) | package(gpu_program_prover) | package(gpu_gkr_uniskip_bench)) & test(/(^|::)cpu_/)'
test-group = '@global'

# slow-timeout: a hung kernel previously wedged the whole suite and the GPU
# lock with it forever. Under nextest a stuck test is terminated after
# period * terminate-after (20 min) and — with fail-fast off — the rest of
# the run proceeds. The cap is sized for the heaviest legitimate #[ignore]d
# proof/e2e tests, which run under the same override.
[[profile.default.overrides]]
filter = 'package(gpu_hash) | package(gpu_core) | package(gpu_ntt) | package(gpu_ops) | package(gpu_cub) | package(gpu_prover_context) | package(gpu_trace) | package(gpu_gkr) | package(gpu_whir) | package(gpu_circuit_prover) | package(gpu_execution_prover) | package(gpu_program_prover) | package(gpu_gkr_uniskip_bench)'
test-group = 'gpu-serial'
slow-timeout = { period = "120s", terminate-after = 10 }

# Non-GPU crates with live #[serial] usage keep the serial_test dep for plain
# `cargo test`, but its mutex is inert under nextest's processes — so each
# such package is conservatively serialized within itself here (packages
# still run in parallel with each other, matching what serial_test provided
# per test binary). Remove a package's entry only after removing its
# #[serial] uses; conversely, a package with no #[serial] uses gets no entry
# (cs, prover, and verifier_generator carried dead serial_test deps — both
# the deps and their groups were dropped).

[test-groups.riscv-transpiler-serial]
max-threads = 1

[test-groups.prover-examples-serial]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(riscv_transpiler)'
test-group = 'riscv-transpiler-serial'

[[profile.default.overrides]]
filter = 'package(prover_examples)'
test-group = 'prover-examples-serial'
