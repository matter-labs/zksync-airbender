[package]
name = "prover_pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cpu_execution_prover = { workspace = true }
execution_prover = { workspace = true }
# Native verification is required on every proving path.
full_statement_verifier = { path = "../full_statement_verifier", default-features = false, features = [
    "host_utils",
    "proof_utils",
    "verifiers",
] }
gpu_execution_prover = { workspace = true, optional = true }
program_prover = { workspace = true }
prover = { workspace = true, features = ["prover"] }
riscv_common = { path = "../riscv_common", default-features = false }
riscv_transpiler = { path = "../riscv_transpiler" }
setups = { workspace = true }
verifier_common = { workspace = true }
worker = { path = "../worker" }

clap = { workspace = true }
log = "0.4"
serde = { workspace = true }
serde_json = "*"
sha3 = { workspace = true }

[features]
default = ["deterministic_pow"]
deterministic_pow = [
    "prover/deterministic_pow",
    "cpu_execution_prover/deterministic_pow",
    "execution_prover/deterministic_pow",
    # `?` so this never enables the GPU stack on its own.
    "gpu_execution_prover?/deterministic_pow",
]

debug_logs = ["prover/debug_logs", "program_prover/debug_logs"]
gpu = ["dep:gpu_execution_prover"]
# Commit recursive WHIR oracle leaves in eval form (see gpu_circuit_prover); the
# verifier must be generated with the matching encoding. No-op without `gpu`.
eval_leaves = ["gpu_execution_prover?/eval_leaves"]
