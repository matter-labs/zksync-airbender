[package]
name = "prover_pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# `deterministic_pow` is pinned here, not exposed as a feature: CI builds
# this crate with `--no-default-features`.
prover = { workspace = true, features = ["prover", "deterministic_pow"] }
setups = { workspace = true }
serde = { workspace = true }
serde_json = "*"
program_prover = { workspace = true, default-features = false }
worker = { path = "../worker" }
clap = { workspace = true }
riscv_transpiler = { path = "../riscv_transpiler" }
riscv_common = { path = "../riscv_common", default-features = false }

verifier_common = { workspace = true }

# Recursion protocol helpers (ND streams, chain, fsv binaries) + native
# verification (`verifiers` comes in via the security_* feature blocks).
full_statement_verifier = { path = "../full_statement_verifier", default-features = false, features = [
    "proof_utils",
    "host_utils",
] }
sha3 = { package = "sha3", version = "*" }
log = "0.4"

# GPU proving stack (behind the `gpu` feature).
gpu_execution_prover = { workspace = true, optional = true, default-features = false, features = [
    "deterministic_pow",
] }
gpu_gkr = { workspace = true, optional = true }
gpu_program_prover = { workspace = true, optional = true, default-features = false, features = [
    "deterministic_pow",
] }

[features]
default = ["security_80"]

security_80 = [
    "program_prover/security_80",
    "verifier_common/security_80",
    "full_statement_verifier/security_80",
    "verifier_common/proof_utils",
    "gpu_execution_prover?/security_80",
    "gpu_program_prover?/security_80",
]
security_100 = [
    "program_prover/security_100",
    "verifier_common/security_100",
    "full_statement_verifier/security_100",
    "verifier_common/proof_utils",
    "gpu_execution_prover?/security_100",
    "gpu_program_prover?/security_100",
]

debug_logs = ["prover/debug_logs", "program_prover/debug_logs"]
# if enabled - allow GPU for proving.
gpu = ["dep:gpu_execution_prover", "dep:gpu_program_prover", "dep:gpu_gkr"]
# Commit recursive WHIR oracle leaves in eval form (see gpu_circuit_prover); the
# verifier must be generated with the matching encoding. No-op without `gpu`.
eval_leaves = ["gpu_execution_prover?/eval_leaves", "gpu_program_prover?/eval_leaves"]
