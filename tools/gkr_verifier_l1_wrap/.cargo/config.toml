[build]
target = "riscv32i-unknown-none-elf"
rustflags = [
  "-C", "target-feature=-unaligned-scalar-mem,+relax,+zimop",
  "-C", "link-arg=-Tmemory.x",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--save-temps",
  "-C", "force-frame-pointers",
  # Reproducibility. Mirrors matter-labs/zksync-os#243.
  # codegen-units=1 removes any dependence on how work is split across codegen threads.
  # Path remapping and debuginfo=0 keep host paths and debug info out of canonical outputs;
  # dump_bin.sh re-enables DWARF for the non-fsv binaries that the VM flamegraph profiles.
  # A build-id hashes ELF metadata (debug info, toolchain strings, and symbol names) into
  # an allocated note that reaches the ROM image, making ROM bytes depend on that metadata.
  # The linker defaults to no note; keep --build-id=none explicit so it is not re-enabled
  # unknowingly, for either the canonical fsv_* set or the profiled guests.
  "-C", "codegen-units=1",
  "-C", "debuginfo=0",
  "-C", "link-arg=--build-id=none",
  "--remap-path-prefix=/zksync-airbender=/src",
]

[unstable]
panic-immediate-abort = true
