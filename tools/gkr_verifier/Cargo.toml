cargo-features = ["panic-immediate-abort"]

[package]
name = "gkr_verifier"
# every binary is listed explicitly below (nested src/bin folders are not auto-discovered)
autobins = false
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-airbender/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk"]
categories = ["cryptography"]

[dependencies]
verifier_common = { path = "../../verifier_common", default-features = false, features = ["modular_ops", "modular_fma"] }
non_determinism_source = { path = "../../non_determinism_source" }
riscv_common = { path = "../../riscv_common", features = ["boot_sequence", "ram_32mb_no_heap"] }
field = { path = "../../field", default-features = false, features = ["modular_ops", "modular_fma"] }
# Full-statement verifier (no_std, verifiers-only — NOT proof_utils, which would pull std + the
# full prover). Used only by the fsv_unified_base_layer bin; the blake variant comes from
# verifier_common's unified features (the FSV's blake feature only forwards there), so no blake pin.
full_statement_verifier = { path = "../../full_statement_verifier", default-features = false, features = ["verifiers"] }

[features]
blake2_with_compression = ["verifier_common/blake2_with_compression"]
blake2_g_function = ["verifier_common/blake2_g_function"]
mop_extension = ["verifier_common/mop_extension"]
modular_fma = ["verifier_common/modular_fma", "field/modular_fma"]
special_opcodes_extension = ["verifier_common/special_opcodes_extension"]
no_caches = ["verifier_common/no_caches"]
verifier_stats = ["verifier_common/verifier_stats"]
default = ["blake2_with_compression"]

# --- Full-statement verifiers (production; `full_statement_verifiers/<name>_<blake>.elf`),
# wired to the pessimistic-conjecture (production) circuit verifiers. The exact set of built
# guests is `verifier_common::fsv_binaries::FSV_REGISTRY`. ---
[[bin]]
name = "fsv_unrolled_base_layer_sec_100"
path = "src/bin/full_statement_verifiers/fsv_unrolled_base_layer_sec_100.rs"

[[bin]]
name = "fsv_unrolled_recursion_layer_sec_100"
path = "src/bin/full_statement_verifiers/fsv_unrolled_recursion_layer_sec_100.rs"

[[bin]]
name = "fsv_unified_base_layer_sec_100"
path = "src/bin/full_statement_verifiers/fsv_unified_base_layer_sec_100.rs"

[[bin]]
name = "fsv_unified_recursion_layer_sec_100"
path = "src/bin/full_statement_verifiers/fsv_unified_recursion_layer_sec_100.rs"

[[bin]]
name = "fsv_unified_recursion_layer_sec_100_l1_feeder"
path = "src/bin/full_statement_verifiers/fsv_unified_recursion_layer_sec_100_l1_feeder.rs"

# --- Full-statement verifiers wired to the ethproofs-soundcalc circuit verifiers
# (`full_statement_verifiers/ethproofs_soundcalc/<name without the mode suffix>_<blake>.elf`).
# No unified base layer: the recursion pipeline never selects it. No L1 feeder: its schedule
# exists only in pessimistic_conjecture. ---
[[bin]]
name = "fsv_unrolled_base_layer_sec_100_ethproofs_soundcalc"
path = "src/bin/full_statement_verifiers/ethproofs_soundcalc/fsv_unrolled_base_layer_sec_100.rs"

[[bin]]
name = "fsv_unrolled_recursion_layer_sec_100_ethproofs_soundcalc"
path = "src/bin/full_statement_verifiers/ethproofs_soundcalc/fsv_unrolled_recursion_layer_sec_100.rs"

[[bin]]
name = "fsv_unified_recursion_layer_sec_100_ethproofs_soundcalc"
path = "src/bin/full_statement_verifiers/ethproofs_soundcalc/fsv_unified_recursion_layer_sec_100.rs"

# --- Per-circuit test verifiers, pessimistic_conjecture (`circuit_verifiers/pessimistic_conjecture/<circuit>.elf`) ---
[[bin]]
name = "add_sub_lui_auipc_mop_pessimistic_conjecture"
path = "src/bin/circuit_verifiers/pessimistic_conjecture/add_sub_lui_auipc_mop.rs"

[[bin]]
