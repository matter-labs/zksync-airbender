[package]
name = "cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
prover = { workspace = true, features = ["prover"] }
setups = { workspace = true }
common_constants = { workspace = true }
serde = { workspace = true }
serde_json = "*"
prover_pipeline = { workspace = true, default-features = false }
worker = { path = "../../worker" }
clap = { workspace = true }
riscv_transpiler = { path = "../../riscv_transpiler" }
field = { workspace = true }

verifier_common = { workspace = true }

reqwest = { version = "0.12.12", features = ["blocking", "json"] }
log = "0.4"

env_logger = "0.11"
base64 = "0.21.7"


[features]
default = ["security_80"]

security_80 = [
    "prover_pipeline/security_80",
    "verifier_common/security_80",
    "verifier_common/proof_utils",
    "field/no_inline",
]
security_100 = [
    "prover_pipeline/security_100",
    "verifier_common/security_100",
    "verifier_common/proof_utils",
    "field/no_inline",
]

debug_logs = ["prover/debug_logs", "prover_pipeline/debug_logs"]
# if enabled - allow GPU for proving.
gpu = ["prover_pipeline/gpu"]
# Commit recursive WHIR oracle leaves in eval form (see gpu_circuit_prover); the
# verifier must be generated with the matching encoding. No-op without `gpu`.
eval_leaves = ["prover_pipeline/eval_leaves"]
