[package]
name = "cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "cli_lib"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
prover = { workspace = true, features = ["prover"] }
setups = { workspace = true }
common_constants = { workspace = true }
serde = { workspace = true }
serde_json = "*"
prover_examples = { path = "../../circuit_defs/prover_examples", default-features = false }
worker = { path = "../../worker" }
clap = { workspace = true }
riscv_transpiler = { path = "../../riscv_transpiler" }
riscv_common = { path = "../../riscv_common", default-features = false }
field = { workspace = true }

verifier_common = { workspace = true }

# Recursion protocol helpers (ND streams, chain, fsv binaries) + native
# verification (`verifiers` comes in via the security_* feature blocks).
full_statement_verifier = { path = "../../full_statement_verifier", default-features = false, features = [
    "proof_utils",
    "replace_csr",
    "host_utils",
] }
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
sha3 = { package = "sha3", version = "*" }
log = "0.4"

# GPU proving stack (behind the `gpu` feature).
execution_prover = { workspace = true, optional = true, default-features = false }
program_prover = { workspace = true, optional = true, default-features = false }

env_logger = "0.11"
base64 = "0.21.7"


[features]
default = ["security_80"]

security_80 = [
    "prover_examples/security_80",
    "verifier_common/security_80",
    "full_statement_verifier/security_80",
    "verifier_common/replace_csr",
    "verifier_common/proof_utils",
    "field/no_inline",
    "execution_prover?/security_80",
    "program_prover?/security_80",
]
security_100 = [
    "prover_examples/security_100",
    "verifier_common/security_100",
    "full_statement_verifier/security_100",
    "verifier_common/replace_csr",
    "verifier_common/proof_utils",
    "field/no_inline",
    "execution_prover?/security_100",
    "program_prover?/security_100",
]

debug_logs = ["prover/debug_logs", "prover_examples/debug_logs"]
# if enabled - allow GPU for proving.
gpu = ["dep:execution_prover", "dep:program_prover"]
