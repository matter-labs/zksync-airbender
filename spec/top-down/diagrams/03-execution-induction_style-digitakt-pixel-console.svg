<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc"><title id="title">Shared state connects the chunks</title><desc id="desc">Unordered chunk rows contribute read and write events. Matching the shared events by address and time connects them into an execution ordered by the program counter. Exact constraints are explained in Section 3.</desc>
