<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="281" viewBox="0 77 1080 281" role="img" aria-labelledby="title desc"><title id="title">PC links connect rows across chunks into a logical execution</title><desc id="desc">Each chunk contains multiple trace rows. A row reads its current program counter and writes its next program counter. Matching the written PC record, including its timestamp, to another row's read links execution across chunks. RAM and register records are also linked by the global memory argument. The state chain depicts logical execution order.</desc>
