[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
# The real Airbender boot: start.s, link.x/memory.x (32 MB RAM), init() (copies .rodata/.data to RAM), memcpy,
# zksync_os_finish_success. As tools/gkr_verifier.
riscv_common = { path = "../../riscv_common", features = ["boot_sequence", "ram_32mb_no_heap"] }
# The verifier's Blake2s (no features on riscv32: the baseline implementation, plain Rust).
blake2s_u32 = { path = "../../blake2s_u32" }

[features]
# BabyBear field ops via Airbender's field opcodes (mop.rr.N), as the real verifier (field: modular_ops +
# modular_fma). Default: the same ops in plain Rust.
mop = []
# Blake2s via Airbender's round-function delegation (CSR 0x7c7, `blake2_with_compression`), as the real verifier.
# Default: the baseline Blake2s in plain Rust.
delegation = ["blake2s_u32/blake2_with_compression"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[workspace]
