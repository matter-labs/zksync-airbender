name = "airbender_circuits"
version = "0.1.0"
defaultTargets = ["Human", "Slop", "airbender_import", "airbender_tests"]

# lean-sail v6 @ c816ea7, fetched by ../sail/fetch-lean-sail.sh with sail/patches/lean-sail-*.patch applied
# (Lean 4.34 compat); no upstream licence, so it is never committed
[[require]]
name = "lean-sail"
path = "sail-rv32/lean-sail"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean.git"
rev = "93c9d1ef45be9f687214625d7857889cf2485504"   # tag v4.33.1 (upstream toolchain v4.33.1)

# Keep Mathlib last so its pinned transitive dependencies take precedence.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "SailRV32"
srcDir = "sail-rv32"

# what a human reads: every definition a final statement depends on
[[lean_lib]]
name = "Human"
srcDir = "human"
roots = ["Human"]
globs = ["Human.+"]
extraDepTargets = ["addSubJson", "jumpBranchSltJson", "unsignedMulDivJson", "shiftBinopJson", "wordMemoryJson", "subwordMemoryJson", "unifiedReducedJson", "blakeGJson", "blakeRoundJson", "bigintJson", "keccakJson"]

# proofs (kernel-checked, not meant to be read)
[[lean_lib]]
name = "Slop"
srcDir = "slop"
roots = ["Slop"]
globs = ["Slop.+"]

# regressions and the axiom audits (not proofs of the claims)
[[lean_lib]]
name = "Test"
srcDir = "test"
roots = ["Checks.Axioms", "Checks.TraceAxioms"]
globs = ["Tests.*", "Checks.*"]

[[input_file]]
name = "addSubJson"
path = "../../cs/compiled_circuits/add_sub_lui_auipc_mop_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "jumpBranchSltJson"
path = "../../cs/compiled_circuits/jump_branch_slt_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "unsignedMulDivJson"
path = "../../cs/compiled_circuits/unsigned_mul_div_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "shiftBinopJson"
path = "../../cs/compiled_circuits/shift_binop_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "wordMemoryJson"
path = "../../cs/compiled_circuits/mem_word_only_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "subwordMemoryJson"
path = "../../cs/compiled_circuits/mem_subword_only_layout_no_caches_gkr.json"
text = true

[[lean_exe]]
name = "airbender_import"
srcDir = "human"
root = "Human.Import.Main"

[[lean_exe]]
name = "airbender_tests"
srcDir = "test"
root = "Tests.ArtifactImport"

[[input_file]]
name = "unifiedReducedJson"
path = "../../cs/compiled_circuits/unified_reduced_machine_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "blakeGJson"
path = "../../cs/compiled_circuits/blake2_g_function_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "blakeRoundJson"
path = "../../cs/compiled_circuits/blake2_with_extended_control_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "bigintJson"
path = "../../cs/compiled_circuits/bigint_with_extended_control_layout_no_caches_gkr.json"
text = true

[[input_file]]
name = "keccakJson"
path = "../../cs/compiled_circuits/keccak_special5_layout_no_caches_gkr.json"
text = true
