# Lake 4.34: `[[input_file]]` listed in `extraDepTargets` gives a nil trace, so editing a circuit JSON
# rebuilt nothing. Each Artifact library uses `needs` (which fetches the input file with a content hash)
# and is its own library, so a JSON change rebuilds only its Artifact module and that module's importers.
name = "airbender_circuits"
version = "0.1.0"
defaultTargets = ["Human", "Slop", "airbender_import", "airbender_tests"]

# the official Sail RISC-V model (sail-riscv 6136f84, airbender-base config), generated by ../sail/regen.sh;
# its lean-sail dependency is fetched by ../sail/fetch-lean-sail.sh (never committed)
[[require]]
name = "sail_rv32"
path = "sail-rv32"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean.git"
rev = "93c9d1ef45be9f687214625d7857889cf2485504"   # tag v4.33.1 (upstream toolchain v4.33.1)

# Keep Mathlib last so its pinned transitive dependencies take precedence.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

