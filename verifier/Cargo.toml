[package]
name = "verifier"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
field = { workspace = true }
unroll = { workspace = true }
verifier_common = { workspace = true , default-features = false }

[features]
# Static canonical proof tests use the production Compression wire layout.
miri_circuits = ["proof_utils", "verifier_common/test_compression"]
# Software Blake selects the Merkle multiproof layout of Compression.
miri_compression = ["proof_utils"]
miri_compression_coverage = ["miri_compression", "verifier_common/multiproof_coverage"]
blake2_with_compression = ["verifier_common/blake2_with_compression"]
blake2_g_function = ["verifier_common/blake2_g_function"]
mop_extension = ["verifier_common/mop_extension"]
special_opcodes_extension = ["verifier_common/special_opcodes_extension"]
modular_ops = ["verifier_common/modular_ops"]
modular_fma = ["verifier_common/modular_fma"]
verifier_program = ["modular_ops"]
proof_utils = ["verifier_common/proof_utils"]
no_caches = ["verifier_common/no_caches"]
verifier_stats = ["verifier_common/verifier_stats"]


[dev-dependencies]
test_utils = { workspace = true }
serde = "1"
serde_json = "*"
prover = {workspace = true, default-features = true}
proc-macro2 = { version = "1" }
quote = { version = "1" }
verifier_common = { workspace = true, features = ["proof_utils"] }
riscv_transpiler = { workspace = true, features = ["flamegraph"] }
common_constants = { workspace = true }
verifier_generator = { workspace = true }
rayon = "1.11.0"
paste = "1"

[[test]]
name = "miri_circuits"
required-features = ["miri_circuits"]

[[example]]
name = "miri_circuit_input"
required-features = ["proof_utils"]

[[test]]
name = "miri_compression"
required-features = ["miri_compression"]

[lints]
workspace = true
