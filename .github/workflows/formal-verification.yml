name: Formal verification

# Weekly assurance and manual runs share the same bounded global worker.
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      diagnose_modules:
        description: "Partial Lean diagnosis only: space-separated project modules; no FV assurance"
        type: string
        default: ""
      cold_build:
        description: Build every project module without restored Lean objects
        type: boolean
        default: false
      refresh_axiom_baseline:
        description: Export a refreshed baseline after the passing environment audit
        type: boolean
        default: false
      full_assurance:
        description: Run the complete independent kernel replay and false-proof controls
        type: boolean
        default: false
      requalify_setups:
        description: Re-export unchanged setup payloads before promoting changed source receipts
        type: boolean
        default: false
  workflow_call:
    inputs:
      diagnose_modules:
        description: "Partial Lean diagnosis only: space-separated project modules; no FV assurance"
        type: string
        default: ""
      cold_build:
        type: boolean
        default: false
      refresh_axiom_baseline:
        type: boolean
        default: false
      full_assurance:
        type: boolean
        default: false
      requalify_setups:
        type: boolean
        default: false

permissions:
  contents: read

# Serialize each ref; each actual worker also takes the host lock.
concurrency:
  group: formal-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: ${{ inputs.diagnose_modules && 'scoped Lean diagnosis (partial)' || (github.event_name == 'schedule' || inputs.full_assurance == true) && 'full assurance' || 'iteration validation' }}
    runs-on: [matterlabs-ci-runner-high-performance]
    # A shared 22-hour work deadline leaves two hours for cleanup, immutable
    # partial-cache snapshots and logs before this runner/job boundary.
    # Each actual worker keeps its existing 900/1800s resource cap.
    timeout-minutes: 1440
    env:
      FV_DIAGNOSE_MODULES: ${{ inputs.diagnose_modules }}
      FV_COLD_BUILD: ${{ inputs.cold_build == true }}
      FV_FULL_ASSURANCE: ${{ inputs.full_assurance == true || github.event_name == 'schedule' }}
      FV_REFRESH_AXIOM_BASELINE: ${{ inputs.refresh_axiom_baseline == true }}
      FV_REQUALIFY_SETUPS: ${{ inputs.requalify_setups == true }}
      CARGO_BUILD_JOBS: '1'
      RAYON_NUM_THREADS: '1'
      # Omit DWARF metadata; keep the pinned compiler, optimization and assertions.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      # Only the default branch can authorize replay-ledger reuse.
      FV_REPLAY_CACHE_TRUSTED: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    defaults:
      run:
        shell: bash
        working-directory: formal_verification/lean
    steps:
      - uses: actions/checkout@v3
      - name: Report verification scope
        env:
          FV_COLD_BUILD: ${{ inputs.cold_build == true }}
          FV_FULL_ASSURANCE: ${{ inputs.full_assurance == true || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          python3 scripts/run_lean_diagnosis.py --validate-only
          if [[ -n "$FV_DIAGNOSE_MODULES" ]]; then
            {
              echo '## Scoped Lean diagnosis — partial result only'
              printf 'Selected modules: %s\n\n' "$FV_DIAGNOSE_MODULES"
              echo 'Uses normal Lake freshness and per-child resource guards. Fresh native exports, compiler captures, complete source/runtime checks, generated-source/decoder checks, environment/axiom audit and full assurance are omitted. This run cannot qualify the PR; standard iteration validation and final full assurance remain required. Large cache uploads are omitted.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$FV_COLD_BUILD" == true ]]; then
            echo 'Cold source benchmark: enabled' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Cold source benchmark: omitted; restored objects still undergo Lake freshness checks' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$FV_FULL_ASSURANCE" == true ]]; then
            echo 'Independent full kernel replay and false-proof controls: enabled' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Independent full kernel replay and false-proof controls: deferred to weekly or manual full assurance' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux guard runtime controls before compiler work
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          command -v timeout >/dev/null
          echo "FV_WORK_DEADLINE=$(($(date +%s) + 22 * 60 * 60))" >> "$GITHUB_ENV"
          FV_ROOT="$RUNNER_TEMP/airbender-fv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$FV_ROOT"
          echo "FV_ROOT=$FV_ROOT" >> "$GITHUB_ENV"
          if [[ "$FV_REPLAY_CACHE_TRUSTED" == true ]]; then
            echo "FV_REPLAY_LEDGER=$GITHUB_WORKSPACE/formal_verification/lean/.lake/verification/replay-ledger" >> "$GITHUB_ENV"
          else
            # Outside the checkout/build caches, fresh for this manual attempt.
            echo "FV_REPLAY_LEDGER=$FV_ROOT/replay-ledger" >> "$GITHUB_ENV"
          fi
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/airbender-fv-cargo/setups" >> "$GITHUB_ENV"
          echo "FV_COMPILER_TARGET_DIR=$RUNNER_TEMP/airbender-fv-cargo/compiler" >> "$GITHUB_ENV"
          # This is a lightweight orchestrator; ProcessTests guard their own
          # children sequentially. An outer guard would deadlock the host lock.
          python3 -m unittest discover -s scripts -p test_bounded_fv.py -v 2>&1 | tee "$FV_ROOT/guard-controls.log"
          python3 scripts/compilation_pool/test_pool.py --process-tests --process-output "$FV_ROOT/pool-controls"
          python3 -m unittest discover -s scripts -p test_run_lean_diagnosis.py -v
          PYTHONPATH=scripts python3 -m unittest test_fv_changes test_axiom_reports test_olean_hashes test_replay_cache test_proof_boundaries test_native_lookup_bindings test_native_memory_policy -v
          cat > "$FV_ROOT/guard.sh" <<'SH'
          set -euo pipefail
          # Lightweight orchestration only: real children still own their
          # existing aggregate resource guard. Reserve 120s for TERM cleanup.
          fv_stage() {
            local label="$1" maximum="$2"
            shift 2
            local remaining=$((FV_WORK_DEADLINE - $(date +%s)))
            if (( remaining <= 120 )); then
              echo "FV work deadline reached before $label" >&2
              return 124
            fi
            local seconds=$((remaining < maximum ? remaining : maximum))
            echo "FV stage $label: deadline ${seconds}s; cleanup reserve 120s"
            timeout --signal=TERM --kill-after=120s "${seconds}s" "$@"
          }
          fv_limited() {
            local label="$1" fv_footprint="$2" fv_resident="$3" fv_profile="$4"
            shift 4
            local fv_profile_args=()
            if [[ "$fv_profile" == native-artifact ]]; then fv_profile_args=(--native-artifact); fi
            python3 "$GITHUB_WORKSPACE/formal_verification/lean/scripts/bounded_fv.py" \
              --mib "$fv_footprint" --resident-mib "$fv_resident" --seconds 900 \
              "${fv_profile_args[@]}" \
              --log "$FV_ROOT/$label.log" -- "$@" | tee "$FV_ROOT/$label.guard.jsonl"
            python3 - "$FV_ROOT/$label.guard.jsonl" <<'PY'
          import json, sys
          records = [json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          records = [record for record in records if 'reason' in record]
          assert len(records) == 1, records
          assert records[0]['reason'] == 'finished' and records[0]['exit'] == 0, records
          assert records[0]['live_owned_after'] == [], records
          PY
          }
          fv() {
            local label="$1"
            shift
            fv_limited "$label" 2560 5120 lean "$@"
          }
          fv_native() {
            local label="$1"
            shift
            python3 "$GITHUB_WORKSPACE/formal_verification/lean/scripts/qualify_native_memory.py" \
              --report "$FV_ROOT/$label.capacity.json"
            fv_limited "$label" 8192 12288 native-artifact "$@"
          }
          SH
      - name: Qualify explicit native artifact memory budget
        if: ${{ !inputs.diagnose_modules }}
        run: |
          source "$FV_ROOT/guard.sh"
          fv native-memory-policy python3 scripts/qualify_native_memory.py --report "$FV_ROOT/native-memory-policy.json"
          echo 'Native artifact and decoder differential jobs: 8192 MiB footprint / 12288 MiB resident; 900s per worker' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lean source, proof audit and kernel replay limits remain 2560 MiB footprint / 5120 MiB resident' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare exact native lock or unqualified re-export snapshot
        if: ${{ !inputs.diagnose_modules }}
        env:
          FV_REQUALIFY_SETUPS: ${{ inputs.requalify_setups == true }}
        run: |
          source "$FV_ROOT/guard.sh"
          if [[ "$FV_REQUALIFY_SETUPS" == true ]]; then
            fv native-candidate python3 scripts/check_setup_freshness.py prepare-requalification --work-dir "$FV_ROOT/native"
          else
            fv native-lock python3 scripts/check_setup_artifacts.py --prepare-lock
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 30
        with:
          toolchain: nightly-2026-08-09
          rustflags: ''
          cache: false
      - name: Install pinned Lean toolchain
        timeout-minutes: 30
        run: |
          source "$FV_ROOT/guard.sh"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.31.0'
          # Pin the executable archive, not a script which downloads latest.
          case "$(uname -m)" in
            x86_64)
              elan_arch=x86_64-unknown-linux-gnu
              elan_sha=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 ;;
            aarch64|arm64)
              elan_arch=aarch64-unknown-linux-gnu
              elan_sha=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
            *) echo 'Unsupported elan installer architecture' >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$elan_arch.tar.gz" -o "$FV_ROOT/elan.tar.gz"
          printf '%s  %s\n' "$elan_sha" "$FV_ROOT/elan.tar.gz" | sha256sum --check
          tar -xzf "$FV_ROOT/elan.tar.gz" -C "$FV_ROOT" elan-init
          fv lean-toolchain "$FV_ROOT/elan-init" -y --default-toolchain 'leanprover/lean4:v4.31.0'
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Scope immutable cache snapshots to source and toolchain
        id: cache-keys
        env:
          FV_LEAN_TOOLS: ${{ hashFiles('formal_verification/lean/lean-toolchain', 'formal_verification/lean/lake-manifest.json', '**/lakefile.*') }}
          FV_LEAN_SOURCE: ${{ hashFiles('formal_verification/lean/**/*.lean', 'formal_verification/lean/scripts/**', 'formal_verification/lean/artifacts/**') }}
          FV_NATIVE_TOOLS: ${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'formal_verification/lean/artifacts/setup/native-cargo.lock', '.cargo/config*') }}
          FV_NATIVE_SOURCE: ${{ hashFiles('**/*.rs', '**/build.rs', 'formal_verification/lean/artifacts/setup/manifest.json', 'cs/compiled_circuits/*layout_no_caches_gkr.json') }}
          FV_REPLAY_TOOLS: ${{ hashFiles('formal_verification/lean/lean-toolchain', 'formal_verification/lean/lake-manifest.json', 'formal_verification/lean/scripts/KernelReplay.lean', 'formal_verification/lean/scripts/check_kernel_replay.py', 'formal_verification/lean/scripts/check_axioms.py', 'formal_verification/lean/scripts/bounded_fv.py') }}
        run: |
          lean="fv-lean-v2-${{ runner.os }}-${{ runner.arch }}-$FV_LEAN_TOOLS"
          native="fv-native-v3-${{ runner.os }}-${{ runner.arch }}-$FV_NATIVE_TOOLS"
          replay="fv-replay-trusted-v3-${{ runner.os }}-${{ runner.arch }}-$FV_REPLAY_TOOLS"
          echo "lean-tool-prefix=$lean-" >> "$GITHUB_OUTPUT"
          echo "lean-source-prefix=$lean-$FV_LEAN_SOURCE-" >> "$GITHUB_OUTPUT"
          echo "lean=$lean-$FV_LEAN_SOURCE-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "native-tool-prefix=$native-" >> "$GITHUB_OUTPUT"
          echo "native-source-prefix=$native-$FV_NATIVE_SOURCE-" >> "$GITHUB_OUTPUT"
          echo "native=$native-$FV_NATIVE_SOURCE-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "replay-prefix=$replay-" >> "$GITHUB_OUTPUT"
          echo "replay=$replay-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: native-cache
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 20
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.FV_COMPILER_TARGET_DIR }}
          key: ${{ steps.cache-keys.outputs.native }}-compiler
          restore-keys: |
            ${{ steps.cache-keys.outputs.native-source-prefix }}
            ${{ steps.cache-keys.outputs.native-tool-prefix }}
      - name: Twelve generators and sixteen complete fresh exports
        id: native-setups
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 370
        env:
          FV_REQUALIFY_SETUPS: ${{ inputs.requalify_setups == true }}
        run: |
          source "$FV_ROOT/guard.sh"
          fv_stage native-setups 21600 bash -euo pipefail <<'FV_STAGE'
          trap 'exit 124' TERM
          source "$FV_ROOT/guard.sh"
          qualification=()
          promotion=()
          if [[ "$FV_REQUALIFY_SETUPS" == true ]]; then
            qualification=(--requalify)
            promotion=(--promote)
          fi
          families=(add-sub jump-branch mul-div shift-binop word-memory subword-memory
            unified bigint blake-g blake-round keccak inits-and-teardowns)
          for family in "${families[@]}"; do
            fv_native "regenerate-$family" env -u CI -u RUST_MIN_STACK python3 scripts/check_setup_freshness.py \
              regenerate "$family" --work-dir "$FV_ROOT/native" "${qualification[@]}"
          done
          for family in "${families[@]}" keccak-column-parity keccak-theta-rho keccak-chi5 decoder-smoke; do
            fv_native "export-$family" env -u CI -u RUST_MIN_STACK python3 scripts/check_setup_freshness.py \
              export "$family" --work-dir "$FV_ROOT/native" "${qualification[@]}"
          done
          # Only this source-keyed, scoped native build's dep-info is supplied.
          mapfile -d '' dep_info < <(find "$CARGO_TARGET_DIR/debug" -type f -name '*.d' -print0)
          test "${#dep_info[@]}" -gt 0
          dep_args=()
          for path in "${dep_info[@]}"; do dep_args+=(--dep-info "$path"); done
          fv native-receipts python3 scripts/check_setup_freshness.py verify \
            --work-dir "$FV_ROOT/native" "${dep_args[@]}" "${qualification[@]}" "${promotion[@]}"
          git diff --quiet -- ../../cs/compiled_circuits
          fv provenance-controls python3 -m unittest discover -s scripts -p test_setup_provenance.py -v
          FV_STAGE
      - name: Upload qualified setup manifest and native execution receipts
        if: steps.native-setups.outcome == 'success' && inputs.requalify_setups == true
        uses: actions/upload-artifact@v4
        with:
          name: qualified-setups-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FV_ROOT }}/native
          if-no-files-found: error
      - name: Save native setup build progress even after a bounded failure
        if: always() && steps.native-cache.outcome == 'success' && steps.native-setups.outcome != 'skipped'
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.FV_COMPILER_TARGET_DIR }}
          key: ${{ steps.cache-keys.outputs.native }}-setups
      - uses: actions/cache/restore@v4
        id: lean-cache
        if: inputs.cold_build != true
        timeout-minutes: 20
        with:
          # Keep mutable build progress separate from the checked replay ledger.
          path: |
            formal_verification/lean/.lake/build
            formal_verification/lean/.lake/config
            formal_verification/lean/.lake/packages
          key: ${{ steps.cache-keys.outputs.lean }}-build
          restore-keys: |
            ${{ steps.cache-keys.outputs.lean-source-prefix }}
            ${{ steps.cache-keys.outputs.lean-tool-prefix }}
      - uses: actions/cache/restore@v4
        id: replay-cache
        if: env.FV_REPLAY_CACHE_TRUSTED == 'true' && (inputs.full_assurance == true || github.event_name == 'schedule')
        timeout-minutes: 20
        with:
          path: ${{ env.FV_REPLAY_LEDGER }}
          key: ${{ steps.cache-keys.outputs.replay }}-controls
          restore-keys: |
            ${{ steps.cache-keys.outputs.replay-prefix }}
      - name: Bootstrap only the cache CLI, fetch Mathlib, then prepare Clean
        id: bootstrap
        timeout-minutes: 190
        run: |
          source "$FV_ROOT/guard.sh"
          fv_stage bootstrap 10800 bash -euo pipefail <<'FV_STAGE'
          trap 'exit 124' TERM
          source "$FV_ROOT/guard.sh"
          # These pinned cache-CLI sources import only each other and Lean/Lake.
          # No lake update, aggregate cold compile, stack increase or trace edits.
          modules=(Batteries.Data.Array.Match Batteries.Data.String.Basic
            Batteries.Data.String.Matcher Batteries.Tactic.OpenPrivate Cache.Lean
            Cache.IO Cache.Hashing Cache.Init Cache.Requests Cache.Main)
          for module in "${modules[@]}"; do
            fv "cache-olean-$module" lake --no-cache build "+$module:olean"
          done
          for module in "${modules[@]}"; do
            fv "cache-native-$module" lake --no-cache build "+$module:o"
          done
          fv cache-executable lake --no-cache build cache
          fv mathlib-cache lake exe cache get
          fv prepare-clean python3 scripts/prepare_clean.py
          git diff --quiet -- lake-manifest.json lean-toolchain
          FV_STAGE
      - name: Fresh cached compiler captures and provenance controls
        id: compiler-captures
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 130
        env:
          FV_REQUALIFY_SETUPS: ${{ inputs.requalify_setups == true }}
        run: |
          source "$FV_ROOT/guard.sh"
          fv_stage compiler-captures 7200 bash -euo pipefail <<'FV_STAGE'
          trap 'exit 124' TERM
          source "$FV_ROOT/guard.sh"
          fv_native compiler-export env -u CI -u RUST_MIN_STACK CARGO_TARGET_DIR="$FV_COMPILER_TARGET_DIR" \
            python3 scripts/generate.py compiler --output "$FV_ROOT/compiler"
          fv compiler-fresh python3 scripts/check_gkr_translations.py --directory "$FV_ROOT/compiler"
          qualification=()
          if [[ "$FV_REQUALIFY_SETUPS" == true ]]; then qualification=(--requalify); fi
          fv compiler-bytes python3 scripts/check_compiler_export_bytes.py "$FV_ROOT/compiler" "${qualification[@]}"
          fv compiler-retained python3 scripts/check_gkr_translations.py
          fv compiler-provenance-controls env PYTHONPATH=scripts python3 -m unittest test_gkr_translation_provenance -v
          fv native-window-semantics python3 scripts/check_gkr_window_semantics.py
          FV_STAGE
      - name: Upload qualified compiler input receipts
        if: steps.compiler-captures.outcome == 'success' && inputs.requalify_setups == true
        uses: actions/upload-artifact@v4
        with:
          name: qualified-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            formal_verification/lean/artifacts/compiler/manifest.json
            ${{ env.FV_ROOT }}/qualified-compiler-receipt.json
          if-no-files-found: error
      - name: Save compiler capture build progress even after a bounded failure
        if: always() && steps.native-cache.outcome == 'success' && steps.compiler-captures.outcome != 'skipped'
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ${{ env.FV_COMPILER_TARGET_DIR }}
          key: ${{ steps.cache-keys.outputs.native }}-compiler
      - name: Cold project source build and module resource table
        id: cold-source-build
        if: inputs.cold_build == true
        timeout-minutes: 910
        run: |
          source "$FV_ROOT/guard.sh"
          fv_stage cold-source-build 54000 python3 - <<'PY'
          import json, os, platform, time
          from pathlib import Path
          from scripts import check_lean as frontend
          root = Path.cwd()
          output = Path(os.environ['FV_ROOT']) / 'cold-build'
          existing = list((root / '.lake/build/lib/lean/Airbender').rglob('*.olean'))
          if existing:
              raise SystemExit('Cold source build requires no existing Airbender objects')
          runner = frontend.Runner(root, root / 'scripts/bounded_fv.py', output, workers=1)
          sources = frontend.discover(root)
          names = sorted(sources)
          values = runner.query('project-imports', ['+' + name + ':imports' for name in names])
          queue = frontend.ordered(names, dict(zip(names, values)))
          frontend.write_json(output / 'source-queue.json', queue)
          started, records = time.monotonic(), []
          for index, module in enumerate(queue):
              target = '+' + module + ':olean'
              label = 'module-' + str(index)
              runner.run(label, ['lake', '--no-cache', 'build', target],
                         review=target in frontend.SOURCE_REVIEW_TARGETS)
              metric = runner.records[label]['metrics'][0]
              record = {'module': module, 'seconds': metric['seconds'],
                        'footprint_peak_mib': metric['footprint_peak_mib'],
                        'resident_peak_mib': metric['resident_peak_mib'],
                        'log': runner.records[label]['log']}
              records.append(record)
              with (output / 'modules.jsonl').open('a') as stream:
                  stream.write(json.dumps(record) + '\n')
              print(str(index + 1) + '/' + str(len(queue)) + ' ' + module, flush=True)
          result = {'passed': True, 'platform': platform.platform(), 'modules': len(queue),
                    'wall_seconds': time.monotonic() - started,
                    'module_seconds_total': sum(row['seconds'] for row in records),
                    'footprint_peak_mib': max(row['footprint_peak_mib'] for row in records),
                    'records': records}
          frontend.write_json(output / 'result.json', result)
          lines = ['| Module | Time (s) | Peak footprint (MiB) |', '| --- | ---: | ---: |']
          lines += ['| ' + row['module'] + ' | ' + str(row['seconds']) + ' | '
                    + str(row['footprint_peak_mib']) + ' |' for row in records]
          lines += ['| Total | ' + str(round(result['module_seconds_total'], 2)) + ' | '
                    + str(result['footprint_peak_mib']) + ' |']
          (output / 'modules.md').write_text('\n'.join(lines) + '\n')
          PY
      - name: Selected Lean modules only — no FV assurance
        id: lean-diagnosis
        if: inputs.diagnose_modules
        timeout-minutes: 190
        run: |
          source "$FV_ROOT/guard.sh"
          # The existing frontend guards every real child; no outer host lock.
          fv_stage lean-diagnosis 10800 python3 scripts/run_lean_diagnosis.py --output "$FV_ROOT/diagnosis"
      - name: Complete serial Lean source and runtime verification
        id: lean-verification
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 910
        run: |
          source "$FV_ROOT/guard.sh"
          # No outer guard: the frontend guards each real child and checks reap metadata.
          # Exercise concrete timestamp witnesses before traversing the full project.
          fv_stage delegation-fixtures 10800 python3 scripts/check_lean.py --guard scripts/bounded_fv.py \
            --output "$FV_ROOT/fixture-lean" --module Tests.BigintMemory \
            --module Tests.DelegationTimestamps --module Tests.DynamicCopyLoopNative \
            --module Tests.PathGLoopNative
          fv_stage lean-verification 54000 python3 scripts/check_lean.py --guard scripts/bounded_fv.py --output "$FV_ROOT/lean"
      - name: Generated source freshness
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 130
        run: |
          source "$FV_ROOT/guard.sh"
          fv_stage generated-source-freshness 7200 python3 scripts/generate.py check
      - name: Public program decoder row differential
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 75
        run: |
          source "$FV_ROOT/guard.sh"
          fv_stage decoder-differential 4500 bash -euo pipefail <<'FV_STAGE'
          source "$FV_ROOT/guard.sh"
          exporter="$CARGO_TARGET_DIR/debug/examples/export_setup_json"
          oracle=".lake/build/bin/program_rows_oracle"
          test -x "$exporter"
          test -x "$oracle"
          python3 scripts/test_program_decoder_rows.py
          for name in one two muldiv blake-caller split-keccak; do
            fv_native "decoder-small-$name" env -u CI -u RUST_MIN_STACK python3 scripts/check_program_decoder_rows.py \
              --exporter "$exporter" --oracle "$oracle" --small-program "$name"
          done
          texts=(../../tools/gkr_verifier/fsv_*.text)
          test "${#texts[@]}" -eq 5
          for text in "${texts[@]}"; do
            name="$(basename "$text" .text)"
            if [[ "$name" == fsv_unrolled_* ]]; then
              config=reduced
              families=add-sub,jump-branch,shift-binop,word-memory
            else
              config=unified
              families=unified
            fi
            fv_native "decoder-$name" env -u CI -u RUST_MIN_STACK python3 scripts/check_program_decoder_rows.py \
              --exporter "$exporter" --oracle "$oracle" --program "$text" \
              --configs "$config" --families "$families"
          done
          production="$FV_ROOT/production-os"
          python3 scripts/fetch_production_program.py --destination "$production"
          fv_native decoder-production-os env -u CI -u RUST_MIN_STACK python3 scripts/check_program_decoder_rows.py \
            --exporter "$exporter" --oracle "$oracle" \
            --program "$production/multiblock_batch.text" --configs full,unified
          FV_STAGE
      - name: Environment-origin proof inventory and standard axioms
        id: axiom-audit
        if: ${{ !inputs.diagnose_modules }}
        timeout-minutes: 190
        run: |
          source "$FV_ROOT/guard.sh"
          sysroot="$(lean --print-prefix)"
          refresh=()
          if [[ '${{ inputs.refresh_axiom_baseline }}' == true ]]; then
            refresh=(--refresh-baseline)
          fi
          fv_stage axiom-audit 10800 python3 scripts/check_axioms.py --guard scripts/bounded_fv.py \
            --sysroot "$sysroot" --output "$FV_ROOT/axioms" "${refresh[@]}"
          if [[ '${{ inputs.refresh_axiom_baseline }}' == true ]]; then
            cp scripts/axiom_baseline.json "$FV_ROOT/axioms/refreshed-baseline.json"
          fi
      - name: Independent kernel replay of the complete compiled dependency DAG
        id: kernel-replay
        if: inputs.full_assurance == true || github.event_name == 'schedule'
        timeout-minutes: 910
        run: |
          source "$FV_ROOT/guard.sh"
          sysroot="$(lean --print-prefix)"
          fv_stage kernel-replay 54000 python3 scripts/check_kernel_replay.py --guard scripts/bounded_fv.py \
            --sysroot "$sysroot" --output "$FV_ROOT/replay" \
            --ledger "$FV_REPLAY_LEDGER" --fresh-project --stack-mib 2048 \
            --axiom-result "$FV_ROOT/axioms/axiom-result.json"
      - name: Save checked replay progress before controls, including failed replay stages
        if: always() && steps.replay-cache.outcome == 'success' && steps.kernel-replay.outcome != 'skipped'
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FV_REPLAY_LEDGER }}
          key: ${{ steps.cache-keys.outputs.replay }}-replay
      - name: Direct and transitive isolated false-proof controls
        id: assurance-controls
        if: inputs.full_assurance == true || github.event_name == 'schedule'
        timeout-minutes: 70
        run: |
          source "$FV_ROOT/guard.sh"
          sysroot="$(lean --print-prefix)"
          fv_stage assurance-controls 3600 python3 scripts/check_assurance_controls.py --guard scripts/bounded_fv.py \
            --sysroot "$sysroot" --output "$FV_ROOT/assurance-controls" \
            --ledger "$FV_REPLAY_LEDGER"
      - name: Save checked replay entries after assurance controls, including failures
        if: always() && steps.replay-cache.outcome == 'success' && steps.assurance-controls.outcome != 'skipped'
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FV_REPLAY_LEDGER }}
          key: ${{ steps.cache-keys.outputs.replay }}-controls
      - name: Record cache footprints for runner qualification
        if: always() && env.FV_ROOT != ''
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = [Path('.lake/build'), Path('.lake/config'), Path('.lake/packages')]
          paths += [Path(os.environ[name]) for name in
                    ('CARGO_TARGET_DIR', 'FV_COMPILER_TARGET_DIR', 'FV_REPLAY_LEDGER')
                    if name in os.environ]
          records = []
          for path in paths:
              record = {'path': str(path), 'present': path.exists()}
              if path.exists():
                  measured = subprocess.run(['du', '-sk', str(path)], text=True, capture_output=True)
                  record['exit'] = measured.returncode
                  if measured.returncode == 0:
                      record['allocated_kib'] = int(measured.stdout.split()[0])
                  else:
                      record['error'] = measured.stderr.strip()
              records.append(record)
          report = {'scope': 'uncompressed filesystem footprint; not archive size or quota qualification',
                    'paths': records}
          (Path(os.environ['FV_ROOT']) / 'cache-footprint.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload exact commands, resource metrics, receipts and failure logs
        if: always()
        timeout-minutes: 20
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FV_ROOT }}
          if-no-files-found: warn
      # Keep large cache uploads off the verification path. A source attempt
      # already contains bootstrap progress, so save only one Lean snapshot.
      - name: Save bootstrap progress when no source stage ran
        if: always() && !inputs.diagnose_modules && steps.cache-keys.outcome == 'success' && steps.bootstrap.outcome != 'skipped' && steps.cold-source-build.outcome == 'skipped' && steps.lean-verification.outcome == 'skipped'
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            formal_verification/lean/.lake/build
            formal_verification/lean/.lake/config
            formal_verification/lean/.lake/packages
          key: ${{ steps.cache-keys.outputs.lean }}-bootstrap
      - name: Save Lean build progress even after a bounded failure
        if: always() && !inputs.diagnose_modules && steps.cache-keys.outcome == 'success' && (steps.cold-source-build.outcome != 'skipped' || steps.lean-verification.outcome != 'skipped')
        timeout-minutes: 20
        uses: actions/cache/save@v4
        with:
          path: |
            formal_verification/lean/.lake/build
            formal_verification/lean/.lake/config
            formal_verification/lean/.lake/packages
          key: ${{ steps.cache-keys.outputs.lean }}-build
