name: "Rust CI"
on:
  push:
    branches:
      - main
      - stable
      - dev
      - av_gkr_compiler
  pull_request:

permissions: read-all

jobs:
  tests:
    name: tests
    runs-on: [matterlabs-ci-runner-high-performance]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
          rustup target add riscv32im-unknown-none-elf
          rustup component add llvm-tools
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked
      - name: Fixture inventory and canonical encoding
        run: |
          cargo test -p proof_fixtures --profile cli
          cargo test -p prover --features test --profile cli --test canonical_fixture_inputs canonical_fixture_encoding
      - name: GKR compiler feature tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test -p gpu_gkr_compiler --profile cli --features search --test forward_corpus --test forward_search --bin gkr-forward-artifact
      - name: Verifier census and fixture gates
        env:
          RUST_MIN_STACK: 1073741824
        run: cargo test -p full_statement_verifier --profile cli --features host_utils,verifiers --lib --test cost_model_trace --test unified
      - name: Shared unified witness drift guard
        env:
          CI: "true"
          RUST_MIN_STACK: 1073741824
        run: cargo test -p unified_reduced_machine_2_22 --profile cli --lib test::witness_eval_fn_matches_sibling -- --exact
      - name: Native verifier tests
        env:
          RUST_MIN_STACK: 1073741824
        run: |
          cargo test -p verifier --profile cli --test native --test mop_montgomery
          cargo test -p verifier --profile cli --test corruption rejects_corrupted_folding_and_ood_pow_nonces_ethproofs_bigint_with_extended_control
      - name: Guest memory runtime
        run: cargo test -p riscv_common

  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""
          # Formatting does not compile dependencies.
          cache: false
      - name: Setup
        run: |
          rustup set profile minimal
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
      - name: Forbid the generic_const_exprs feature gate
        run: |
          if grep -rn --include='*.rs' --exclude-dir=target 'feature(generic_const_exprs)' . ; then
            echo 'generic_const_exprs is incompatible with the next-generation trait solver; use FieldExtension::Coeffs instead'
            exit 1
          fi

  warnings:
    name: warnings (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            rustflags: "-D warnings"
            args: ""
          - name: no-default-features
            rustflags: "-D warnings"
            args: "--no-default-features"
          - name: x86-64-v4
            rustflags: "-D warnings -C target-cpu=x86-64-v4"
            # An explicit target keeps RUSTFLAGS off build scripts, which run on the runner's CPU.
            args: "--target x86_64-unknown-linux-gnu"
          - name: host-features
            rustflags: "-D warnings"
            # gpu_core and gpu_ntt have no features of their own.
            features: "--features $(python3 .github/scripts/clippy_features.py)"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # no_cuda mode: the GPU crates skip their CMake/nvcc builds.
      ZKSYNC_USE_CUDA_STUBS: "1"
      RUST_MIN_STACK: 1073741824
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
          cache-key: ${{ matrix.name }}
      # The bench-only dev-dependency era_criterion_cuda of gpu_core and gpu_ntt needs a CUDA toolkit.
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --exclude gpu_core --exclude gpu_ntt ${{ matrix.args }} ${{ matrix.features }}
          cargo clippy -p gpu_core -p gpu_ntt --lib ${{ matrix.args }}

  check_verifiers:
    name: check_verifiers
    runs-on: [matterlabs-ci-runner-ultra-performance]
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile default
          # `cargo objcopy` for the guest dumps (tools/gkr_verifier/dump_bin.sh); the guest
          # toolchain itself is installed on demand from tools/gkr_verifier/rust-toolchain.toml.
          cargo install cargo-binutils --version '=0.4.0' --locked

      - name: Build fresh verifiers
        run: |
          ./build.sh --skip-circuit-verifiers

      - name: Fail if any files were modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ The following files were modified or added. Did you run build.sh?:"
            git status --porcelain
            exit 1
          fi

  check_circuit_verifiers:
    name: check_circuit_verifiers
    runs-on: [matterlabs-ci-runner-ultra-performance]
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile default
          # `cargo objcopy` for the guest dumps (tools/gkr_verifier/dump_bin.sh); the guest
          # toolchain itself is installed on demand from tools/gkr_verifier/rust-toolchain.toml.
          cargo install cargo-binutils --version '=0.4.0' --locked

      - name: Build the per-circuit verifiers
        run: |
          ./tools/reproduce/reproduce.sh --only-circuit-verifiers

      - name: Fail if any files were modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ The following files were modified or added. Did you run tools/reproduce/reproduce.sh?:"
            git status --porcelain
            exit 1
          fi

  guest_clippy:
    name: guest clippy
    runs-on: [matterlabs-ci-runner-high-performance]
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # rust-src: the root-workspace guest dependencies are linted with -Z build-std.
          components: clippy, rust-src
          target: riscv32i-unknown-none-elf
          rustflags: ""
      - name: Setup
        # The verifier guests' toolchain is installed on demand from
        # tools/gkr_verifier/rust-toolchain.toml; the default profile brings clippy.
        run: rustup set profile default
      - name: Clippy on every guest workspace
        run: .github/scripts/guest_clippy.sh

  evm_verifier:
    name: evm_verifier
    runs-on: [matterlabs-ci-runner-c3d]
    timeout-minutes: 30
    env:
      RUST_MIN_STACK: 1073741824
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: rustup set profile minimal
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
      - name: Regenerate EVM verifier contracts and calldata
        run: |
          cargo test -p verifier_evm --release --test generate_contracts -- --ignored
          cargo test -p verifier_evm --release --test flatten_calldata -- --ignored
      - name: EVM verifier Foundry tests
        # Forge installs solc as pinned by each project's foundry.toml under l1_wrap/.
        run: bash -o pipefail verifier_evm/generated_contracts/run_merged.sh
      - name: Fail if the generated contract or calldata changed
        run: |
          if [ -n "$(git status --porcelain -- verifier_evm/)" ]; then
            git status --porcelain -- verifier_evm/
            exit 1
          fi

  cli_smoke_verify:
    name: cli_smoke_verify
    needs: fixture_build
    runs-on: [matterlabs-ci-runner-high-performance]
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
    env:
      RUST_MIN_STACK: 1073741824
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          # ca-certificates brings libssl3, which the CLI test executable loads.
          apt-get install -y --no-install-recommends ca-certificates git python3
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: fixture-executables
          path: fixture-executables/
      - name: CPU tests
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          artifacts = workspace / "fixture-executables"
          manifest = json.loads((artifacts / "cpu-tests.json").read_text())
          if manifest["workspace"] != str(workspace):
              raise SystemExit(f"CPU test build workspace {manifest['workspace']} differs from GITHUB_WORKSPACE {workspace}")
          for test in manifest["tests"]:
              executable = artifacts / test["executable"]
              executable.chmod(0o755)
              package_dir = workspace / test["package_dir"]
              print(f"Running {test['name']} ({test['kind'][0]}) in {package_dir}", flush=True)
              subprocess.run([str(executable), "--test-threads=1"], cwd=package_dir, check=True)
          PYTHON

  fixture_build:
    name: fixture_build
    runs-on: [matterlabs-ci-runner-ultra-performance]
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
    env:
      RUST_MIN_STACK: 16777216
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libssl-dev pkg-config python3
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-key: release-thin
      - name: Build fixture executables
        run: |
          mkdir -p fixture-executables
          cargo build --profile release-thin -p cli
          cargo build --profile release-thin -p proof_fixtures --bin fixture-codec
          cargo test -p prover --lib --features test --profile cli --no-run --message-format=json > fixture-build.json
          python3 - <<'PYTHON'
          import json, shutil
          messages = [json.loads(line) for line in open("fixture-build.json")]
          executables = [message["executable"] for message in messages
                         if message.get("reason") == "compiler-artifact"
                         and message["target"]["name"] == "prover"
                         and message["profile"]["test"] and message.get("executable")]
          assert len(executables) == 1, executables
          shutil.copy2(executables[0], "fixture-executables/canonical-producer")
          PYTHON
          cp target/release-thin/cli target/release-thin/fixture-codec fixture-executables/
      - name: Build CPU test executables
        run: |
          cargo test --profile release-thin -p execution_prover_model -p execution_prover \
            -p cpu_execution_prover -p prover_pipeline -p cli \
            --no-run --message-format=json > cpu-test-build.json
          python3 - <<'PYTHON'
          import json, pathlib, shutil

          expected = {
              ("tools/cli", ("bin",), "cli"),
              ("cpu_execution_prover", ("lib",), "cpu_execution_prover"),
              ("cpu_execution_prover", ("test",), "execution_reference"),
              ("execution_prover", ("lib",), "execution_prover"),
              ("execution_prover_model", ("lib",), "execution_prover_model"),
              ("prover_pipeline", ("lib",), "prover_pipeline"),
          }
          workspace = pathlib.Path.cwd()
          executables = {}
          for line in pathlib.Path("cpu-test-build.json").read_text().splitlines():
              message = json.loads(line)
              if (message.get("reason") != "compiler-artifact"
                      or not message["profile"]["test"] or not message.get("executable")):
                  continue
              package_dir = pathlib.Path(message["manifest_path"]).parent.relative_to(workspace).as_posix()
              target = message["target"]
              key = (package_dir, tuple(target["kind"]), target["name"])
              if key in executables:
                  raise SystemExit(f"Duplicate CPU test executable: {key}")
              executables[key] = message["executable"]
          if set(executables) != expected:
              raise SystemExit(f"Unexpected CPU test executables: {sorted(executables)}; expected {sorted(expected)}")
          artifacts = pathlib.Path("fixture-executables")
          (artifacts / "cpu-tests").mkdir(parents=True, exist_ok=True)
          tests = []
          for (package_dir, kind, name), executable in sorted(executables.items()):
              destination = f"cpu-tests/{kind[0]}-{name}"
              shutil.copy2(executable, artifacts / destination)
              tests.append(dict(package_dir=package_dir, kind=kind, name=name, executable=destination))
          manifest = dict(workspace=str(workspace), tests=tests)
          (artifacts / "cpu-tests.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-executables
          path: fixture-executables/
          if-no-files-found: error

  fixture_currency:
    name: fixture_currency (${{ matrix.mode }}, ${{ matrix.stage }})
    needs: fixture_build
    runs-on: [matterlabs-ci-runner-ultra-performance]
    timeout-minutes: 180
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [pessimistic_conjecture, ethproofs_soundcalc]
        stage: [circuits, base_unified, unrolled]
        include:
          - mode: pessimistic_conjecture
            stage: compression
          - mode: ethproofs_soundcalc
            stage: compression
    defaults:
      run:
        shell: bash
    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          # ca-certificates brings libssl3, which the CLI loads.
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: fixture-executables
          path: fixture-executables/
      - name: Check fixture currency
        run: |
          export FIXTURE_CLI="$GITHUB_WORKSPACE/fixture-executables/cli"
          export FIXTURE_CANONICAL_PRODUCER="$GITHUB_WORKSPACE/fixture-executables/canonical-producer"
          export FIXTURE_CODEC="$GITHUB_WORKSPACE/fixture-executables/fixture-codec"
          chmod +x fixture-executables/*
          fixtures/regenerate.sh --check --mode "${{ matrix.mode }}" --stage "${{ matrix.stage }}"

  # Keep branch protection tied to one stable check name even as the
  # underlying CI fan-out changes over time.
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - tests
      - formatting
      - warnings
      - check_verifiers
      - check_circuit_verifiers
      - evm_verifier
      - cli_smoke_verify
      - fixture_build
      - fixture_currency
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
