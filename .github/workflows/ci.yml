name: "Rust CI"
on:
  push:
    branches:
      - main
      - stable
      - dev
  pull_request:

permissions: read-all

jobs:
  tests:
    name: tests
    runs-on: [matterlabs-ci-runner-high-performance]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
          rustup target add riscv32im-unknown-none-elf
          rustup component add llvm-tools
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked
      - name: Compile
        run: cargo build --verbose
      - name: Unit tests (CI)
        env:
          CI: "true"
        run: cargo test --profile cli -- --nocapture
      - name: GPU test serialization drift guard
        run: cargo test -p gpu_core --profile cli cpu_nextest_config_covers_all_gpu_crates
      - name: GKR compiler feature tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test -p gpu_gkr_compiler --profile cli --features search --test forward_search --bin gkr-forward-artifact

  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
      # rustup switches to the 1.97.1 pinned by this directory's rust-toolchain.toml,
      # and the setup action only installed rustfmt for the default toolchain.
      - name: Install rustfmt for the gkr_verifier toolchain
        if: always()
        working-directory: tools/gkr_verifier
        run: rustup component add rustfmt
      # `if: always()` so this is not silently skipped whenever the root check above fails.
      - name: Rustfmt Check (gkr_verifier sub-workspace)
        if: always()
        working-directory: tools/gkr_verifier
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: [matterlabs-ci-runner-high-performance]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - name: Setup
        run: rustup set profile minimal
      - name: Clippy (CPU workspace)
        run: |
          cargo clippy --workspace \
            --exclude gpu_circuit_prover \
            --exclude gpu_core \
            --exclude gpu_execution_prover \
            --exclude gpu_gkr \
            --exclude gpu_gkr_compiler \
            --exclude gpu_gkr_model \
            --exclude gpu_hash \
            --exclude gpu_native_build \
            --exclude gpu_ntt \
            --exclude gpu_ops \
            --exclude gpu_program_prover \
            --exclude gpu_prover_context \
            --exclude gpu_trace \
            --exclude gpu_whir \
            --exclude gpu_witness_eval_generator \
            --lib --tests --bins \
            -- -D warnings
      # Same reason as the rustfmt install in the formatting job: this directory
      # pins 1.97.1 and the setup action only added clippy to the default toolchain.
      - name: Install clippy for the gkr_verifier toolchain
        working-directory: tools/gkr_verifier
        run: rustup component add clippy
      - name: Clippy (gkr_verifier sub-workspace)
        working-directory: tools/gkr_verifier
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo clippy --bins -- -D warnings
  
  circuits_generated:
    name: circuits_generated
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile default
      - name: Regenerate verifiers
        run: ./recreate_verifiers.sh
      - name: Check if anything has changed
        run: |
          MODIFIED_FILES=$(git status --porcelain)
          if [ -n "$MODIFIED_FILES" ]; then
            echo "The following files were modified - did you run ./recreate_verifiers.sh? "
            echo "$MODIFIED_FILES"
            exit 1
          else
            echo "No files were modified."
          fi

  check_verifiers:
    name: check_verifiers
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Build fresh verifiers
        run: |
          tools/reproduce/reproduce.sh

      - name: Fail if any files were modified
        run: |
          git status --porcelain
          git diff --name-only
          if [ -n "$(git diff --name-only)" ]; then
            echo "❌ The following files were modified. Did you run tools/reproduce/reproduce.sh?:"
            git diff --name-only
            exit 1
          fi

  build_cli:
    name: build_cli (${{ matrix.security_label }})
    runs-on: [matterlabs-ci-runner-c3d]
    strategy:
      fail-fast: false
      matrix:
        include:
          - security_label: security_80
            artifact_name: cli_80
            build_command: cargo build --release -p cli
          - security_label: security_100
            artifact_name: cli_100
            build_command: cargo build --release -p cli --no-default-features --features security_100
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: rustup set profile minimal
      - name: Compile
        run: ${{ matrix.build_command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/cli
            examples/basic_fibonacci/app.bin
            examples/basic_fibonacci/app.text

  cli_smoke_verify:
    name: cli_smoke_verify (${{ matrix.security_label }})
    runs-on: [matterlabs-ci-runner-c3d]
    needs: [build_cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - security_label: security_80
            artifact_name: cli_80
          - security_label: security_100
            artifact_name: cli_100
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
      - name: Setup
        run: |
          chmod +x ./target/release/cli
          mkdir -p output
      - name: Prove base
        run: ./target/release/cli prove --bin examples/basic_fibonacci/app.bin --target base --backend cpu --cpu-cycles-bound 16777216 --cpu-worker-threads 8 --output-dir output --output-file base.json
      - name: Verify base
        run: ./target/release/cli verify --proof output/base.json --bin examples/basic_fibonacci/app.bin
      - name: Continue to recursion unified
        run: ./target/release/cli continue-proof --proof output/base.json --bin examples/basic_fibonacci/app.bin --target recursion-unified --cpu-cycles-bound 16777216 --cpu-worker-threads 8 --output-dir output --output-file recursion_unified.json
      - name: Verify recursion unified
        run: ./target/release/cli verify --proof output/recursion_unified.json --bin examples/basic_fibonacci/app.bin

  # Keep branch protection tied to one stable check name even as the
  # underlying CI fan-out changes over time.
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - tests
      - formatting
      - clippy
      - circuits_generated
      - check_verifiers
      - build_cli
      - cli_smoke_verify
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
