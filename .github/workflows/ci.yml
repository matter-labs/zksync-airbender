name: "Rust CI"
on:
  push:
    branches:
      - main
      - stable
      - dev
      - av_gkr_compiler
  pull_request:

permissions: read-all

jobs:
  tests:
    name: tests
    runs-on: [matterlabs-ci-runner-high-performance]
    # The non-ignored GKR e2e tests (prover tests::gkr::*) run for tens of
    # minutes under `--profile cli` (opt-level 3 but dev-based, so debug
    # assertions stay on in the prover hot loops).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
          rustup target add riscv32im-unknown-none-elf
          rustup component add llvm-tools
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked
      - name: Compile
        run: cargo build --verbose
      - name: Prover smoke test (CI)
        env:
          CI: "true"
          RUST_MIN_STACK: 16777216
        run: cargo test -p prover --profile cli -- --nocapture gkr_run_basic_unrolled_test_sec_100
      - name: Fail if the smoke test changed the committed test proofs
        run: |
          if [ -n "$(git status --porcelain -- prover/test_proofs)" ]; then
            echo "❌ The smoke test regenerated these test proofs; commit them:"
            git status --porcelain -- prover/test_proofs
            exit 1
          fi
      - name: GKR compiler feature tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test -p gpu_gkr_compiler --profile cli --features search --test forward_corpus --test forward_search --bin gkr-forward-artifact
      - name: Verifier cost-model drift guard
        env:
          RUST_MIN_STACK: 1073741824
        run: cargo test -p full_statement_verifier --profile cli --features host_utils,verifiers --lib --test cost_model_drift

  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: ""
          # Formatting does not compile dependencies.
          cache: false
      - name: Setup
        run: |
          rustup set profile minimal
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
      - name: Forbid the generic_const_exprs feature gate
        run: |
          if grep -rn --include='*.rs' --exclude-dir=target 'feature(generic_const_exprs)' . ; then
            echo 'generic_const_exprs is incompatible with the next-generation trait solver; use FieldExtension::Coeffs instead'
            exit 1
          fi

  warnings:
    name: warnings (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            rustflags: "-D warnings"
            args: ""
          - name: no-default-features
            rustflags: "-D warnings"
            args: "--no-default-features"
          - name: x86-64-v4
            rustflags: "-D warnings -C target-cpu=x86-64-v4"
            # An explicit target keeps RUSTFLAGS off build scripts, which run on the runner's CPU.
            args: "--target x86_64-unknown-linux-gnu"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # no_cuda mode: the GPU crates skip their CMake/nvcc builds.
      ZKSYNC_USE_CUDA_STUBS: "1"
      RUST_MIN_STACK: 1073741824
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-key: ${{ matrix.name }}
      # The bench-only dev-dependency era_criterion_cuda of gpu_core and gpu_ntt needs a CUDA toolkit.
      - name: Check
        run: |
          cargo check --workspace --all-targets --exclude gpu_core --exclude gpu_ntt ${{ matrix.args }}
          cargo check -p gpu_core -p gpu_ntt --lib ${{ matrix.args }}

  circuits_generated:
    name: circuits_generated
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile default
      - name: Regenerate verifiers
        run: ./recreate_verifiers.sh
      - name: Check if anything has changed
        run: |
          MODIFIED_FILES=$(git status --porcelain)
          if [ -n "$MODIFIED_FILES" ]; then
            echo "The following files were modified - did you run ./recreate_verifiers.sh? "
            echo "$MODIFIED_FILES"
            exit 1
          else
            echo "No files were modified."
          fi

  check_verifiers:
    name: check_verifiers
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile default
          # `cargo objcopy` for the guest dumps (tools/gkr_verifier/dump_bin.sh); the guest
          # toolchain itself is installed on demand from tools/gkr_verifier/rust-toolchain.toml.
          cargo install cargo-binutils --version '=0.4.0' --locked

      - name: Build fresh verifiers
        run: |
          ./build.sh

      - name: Fail if any files were modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ The following files were modified or added. Did you run build.sh?:"
            git status --porcelain
            exit 1
          fi

  evm_verifier:
    name: evm_verifier
    runs-on: [matterlabs-ci-runner-c3d]
    timeout-minutes: 30
    env:
      RUST_MIN_STACK: 1073741824
    steps:
      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Setup
        run: rustup set profile minimal
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
      - name: EVM verifier Foundry tests
        # Forge installs the solc version pinned in merged/foundry.toml.
        # Preserve forge failures through the script's output filters.
        run: bash -o pipefail verifier_evm/generated_contracts/run_merged.sh --no-gas
      - name: Fail if the generated contract or calldata changed
        run: git diff --exit-code -- verifier_evm/

  cli_smoke_verify:
    name: cli_smoke_verify
    runs-on: [matterlabs-ci-runner-high-performance]
    timeout-minutes: 180
    container:
      image: ubuntu:24.04
    env:
      RUST_MIN_STACK: 1073741824
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libssl-dev pkg-config
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build CPU CLI
        run: cargo build --release -p cli
      - name: CPU tests
        run: |
          cargo test --release -p execution_prover_model -p execution_prover \
            -p cpu_execution_prover -p prover_pipeline -p cli \
            -- --test-threads=1
      - name: Prove base
        run: ./target/release/cli prove --bin examples/basic_fibonacci/app.bin --target base --backend cpu --cycles-bound 16777216 --worker-threads 8 --output-dir output --output-file base.json
      - name: Verify base
        run: ./target/release/cli verify --proof output/base.json --bin examples/basic_fibonacci/app.bin
      - name: Continue to recursion unified
        run: ./target/release/cli continue-proof --proof output/base.json --bin examples/basic_fibonacci/app.bin --target recursion-unified --cycles-bound 16777216 --worker-threads 8 --output-dir output --output-file recursion_unified.json
      - name: Verify recursion unified
        run: ./target/release/cli verify --proof output/recursion_unified.json --bin examples/basic_fibonacci/app.bin
  formal_verification_changes:
    name: Formal verification change selection
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: changes
        env:
          FV_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FV_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          result=$(python3 formal_verification/lean/scripts/fv_changes.py --base "$FV_BASE" --head "$FV_HEAD")
          echo "relevant=$result" >> "$GITHUB_OUTPUT"

  # Advisory until full Linux and cold-cache validation establish feasibility.
  # Keep this outside pr-checks.needs so unrelated Rust PRs do not wait for FV.
  formal_verification:
    name: Formal verification
    needs: formal_verification_changes
    if: needs.formal_verification_changes.outputs.relevant == 'true'
    uses: ./.github/workflows/formal-verification.yml

  # Keep branch protection tied to one stable check name even as the
  # underlying CI fan-out changes over time.
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - tests
      - formatting
      - warnings
      - circuits_generated
      - check_verifiers
      - evm_verifier
      - cli_smoke_verify
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
