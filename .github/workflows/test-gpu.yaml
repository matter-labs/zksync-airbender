name: Test on GPU

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  zksync-airbender-build:
    runs-on: [ matterlabs-ci-runner-highmem ]
    strategy:
      fail-fast: false
      matrix:
        # matterlabs-ci-gpu-runner currently has CUDA 12.2 driver support only, so
        # CUDA 13-compiled binaries are not runnable there.
        cuda: [ "12.9.1-devel-ubuntu22.04" ]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}
    env:
      RUST_TOOLCHAIN: nightly-2026-02-10
    steps:
      - name: Prepare environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update && apt install -y cmake git libssl-dev pkg-config wget curl
          echo "/usr/local/nvidia/bin:/usr/local/cuda/bin" >> $GITHUB_PATH

      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Setup rustup
        run: |
          wget -q -O - https://sh.rustup.rs | bash -s -- -y --default-toolchain $RUST_TOOLCHAIN --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          echo "export PATH=\"$HOME/.cargo/bin:\$PATH\"" >> "${HOME}/.bash_profile"

      # we need cmake 3.30 (as 3.24 doesn't properly pass cuda_standard_20)
      - name: Setup CMAKE
        run: |
          curl -fLO --retry 5 --retry-all-errors https://github.com/Kitware/CMake/releases/download/v3.30.2/cmake-3.30.2-linux-x86_64.sh && \
            chmod +x cmake-3.30.2-linux-x86_64.sh && \
            ./cmake-3.30.2-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Check CUDA version
        run: |
          nvcc --version

      - name: Build CLI and copy binaries to a separate dir
        shell: bash
        run: |
          mkdir artifacts
          # Build one CLI binary with GPU support (plus the carried-chain combine
          # smoke binary), then exercise each runtime security level in the test
          # matrix below.
          # Build for A100 (sm_80), L4 (sm_89), and H100 (sm_90).
          CUDAARCHS="80;89;90" \
          cargo +$RUST_TOOLCHAIN build -p cli --features "gpu" --release --target x86_64-unknown-linux-gnu \
            --bin cli --example gpu_combine_smoke
          cp target/x86_64-unknown-linux-gnu/release/cli artifacts/cli
          cp target/x86_64-unknown-linux-gnu/release/examples/gpu_combine_smoke artifacts/gpu_combine_smoke

      - name: Upload CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-cli
          path: |
            artifacts/cli
            artifacts/gpu_combine_smoke
          if-no-files-found: error

  zksync-airbender-test:
    runs-on: [ matterlabs-ci-gpu-runner ]
    strategy:
      fail-fast: false
      matrix:
        # Keep this aligned with the build matrix because runner driver support is
        # currently limited to CUDA 12.2 (CUDA 13 artifacts fail at runtime).
        cuda: [ "12.9.1-devel-ubuntu22.04" ]
        security_level: [ "80", "100" ]

    needs: zksync-airbender-build
    steps:
      - name: Prepare environment
        run: |
          echo "/usr/local/nvidia/bin:/usr/local/cuda/bin" >> $GITHUB_PATH

      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Check Nvidia driver version
        run: |
          nvidia-smi

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-cli
          path: zksync-airbender-cli/

      - name: Prove recursion unified on GPU
        shell: bash
        run: |
          set -euo pipefail
          chmod +x zksync-airbender-cli/cli
          BIN="$PWD/examples/opcode_smoke/app.bin"
          TEXT="$PWD/examples/opcode_smoke/app.text"
          INPUT="$PWD/examples/opcode_smoke/input.txt"
          for preset in low auto; do
            zksync-airbender-cli/cli prove \
              --bin "$BIN" \
              --text "$TEXT" \
              --input-file "$INPUT" \
              --security-level ${{ matrix.security_level }} \
              --target recursion-unified \
              --backend gpu \
              --gpu-memory-preset "$preset" \
              --output-dir "output-$preset" \
              --output-file proof.json
          done

      - name: Verify recursion unified proofs
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/examples/opcode_smoke/app.bin"
          TEXT="$PWD/examples/opcode_smoke/app.text"
          for preset in low auto; do
            verify_output="$(zksync-airbender-cli/cli verify \
              --proof "output-$preset/proof.json" \
              --bin "$BIN" \
              --text "$TEXT" \
              --security-level ${{ matrix.security_level }} \
              --target recursion-unified)"
            echo "$verify_output"
            echo "$verify_output" | grep -F "output=[1330660171, 0, 0, 42, 2374183677, 305419896, 524296, 0"
          done

      - name: Combine recursion unified proofs on GPU
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/examples/opcode_smoke/app.bin"
          TEXT="$PWD/examples/opcode_smoke/app.text"
          # The low- and auto-preset runs above proved the same program and input
          # twice, so their artifacts are valid inputs for a combine.
          zksync-airbender-cli/cli combine \
            --proofs output-low/proof.json output-auto/proof.json \
            --bin "$BIN" \
            --text "$TEXT" \
            --security-level ${{ matrix.security_level }} \
            --backend gpu \
            --output-dir output-combined \
            --output-file proof.json

      - name: Verify combined proof
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/examples/opcode_smoke/app.bin"
          TEXT="$PWD/examples/opcode_smoke/app.text"
          verify_output="$(zksync-airbender-cli/cli verify \
            --proof output-combined/proof.json \
            --bin "$BIN" \
            --text "$TEXT" \
            --security-level ${{ matrix.security_level }} \
            --target recursion-combined)"
          echo "$verify_output"
          # Words 0..8 are the keccak rolling hash of the two combined proofs'
          # outputs; both inputs have the output checked above, so the hash is the
          # same value the CPU combine step in ci.yml expects.
          echo "$verify_output" | grep -F "output=[3905229877, 2075736390, 654440390, 3518657005, 36029780, 78097385, 328053251, 983946315"

      - name: Combine twice through one carried-chain combiner on GPU
        shell: bash
        run: |
          set -euo pipefail
          chmod +x zksync-airbender-cli/gpu_combine_smoke
          BIN="$PWD/examples/opcode_smoke/app.bin"
          TEXT="$PWD/examples/opcode_smoke/app.text"
          # Two sequential combines through one CarriedChainCombiner: the second
          # round reuses the cached host state while re-creating the CUDA contexts
          # and the fixed-size device memory pool.
          zksync-airbender-cli/gpu_combine_smoke \
            --proofs output-low/proof.json output-auto/proof.json \
            --security-level ${{ matrix.security_level }} \
            --output-dir output-carried
          for round in 1 2; do
            verify_output="$(zksync-airbender-cli/cli verify \
              --proof "output-carried/combined_round_${round}.json" \
              --bin "$BIN" \
              --text "$TEXT" \
              --security-level ${{ matrix.security_level }} \
              --target recursion-combined)"
            echo "$verify_output"
            echo "$verify_output" | grep -F "output=[3905229877, 2075736390, 654440390, 3518657005, 36029780, 78097385, 328053251, 983946315"
          done

  # Keep branch protection tied to one stable GPU check name even if we
  # split GPU coverage across multiple jobs or matrix entries later on.
  gpu-checks:
    name: gpu-checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - zksync-airbender-build
      - zksync-airbender-test
    steps:
      - name: Decide on GPU checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
