name: Test on GPU

on:
  push:
    branches:
      - main
      - av_gkr_compiler
  pull_request:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  zksync-airbender-build:
    runs-on: [ matterlabs-ci-runner-high-performance ]
    strategy:
      fail-fast: false
      matrix:
        cuda: [ "13.3.1" ]
        ubuntu: [ "ubuntu26.04" ]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-${{ matrix.ubuntu }}
    env:
      RUST_TOOLCHAIN: nightly-2026-08-09
      RUST_MIN_STACK: 16777216
      RUSTFLAGS: "-D warnings"
      # Preserve all supported architectures when reusing cached native objects.
      CUDAARCHS: "80;89;90;120"
      # Compile architecture variants concurrently to shorten long single-file builds.
      CUDAFLAGS: "--threads=4"
      RUSTC_WRAPPER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Preserve cache statistics through long compiler phases.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Prepare environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update && apt install -y cmake git libssl-dev pkg-config wget curl python3
          echo "/usr/local/nvidia/bin:/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Setup rustup
        run: |
          wget -q -O - https://sh.rustup.rs | bash -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          echo "export PATH=\"$HOME/.cargo/bin:\$PATH\"" >> "${HOME}/.bash_profile"

      # we need cmake 3.30 (as 3.24 doesn't properly pass cuda_standard_20)
      - name: Setup CMAKE
        run: |
          curl -LO https://github.com/Kitware/CMake/releases/download/v3.30.2/cmake-3.30.2-linux-x86_64.sh && \
            chmod +x cmake-3.30.2-linux-x86_64.sh && \
            ./cmake-3.30.2-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Check CUDA version
        run: |
          nvcc --version

      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.18.0"

      - name: Record build environment
        shell: bash
        run: |
          mkdir -p build-diagnostics
          {
            date -u
            rustc -Vv
            nvcc --version
            cmake --version
            gcc --version
            lscpu
            free -h
            for setting in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/memory.max /proc/pressure/cpu; do
              if [[ -f "$setting" ]]; then
                echo "$setting"
                cat "$setting"
              fi
            done
          } | tee build-diagnostics/environment.txt

      - name: GPU test serialization drift guard
        run: cargo +"$RUST_TOOLCHAIN" test -p gpu_core --profile release-thin --target x86_64-unknown-linux-gnu cpu_nextest_config_covers_all_gpu_crates

      - name: Build CLI
        shell: bash
        run: |
          mkdir artifacts
          # Build for A100 (sm_80), L4 (sm_89), H100 (sm_90), and RTX PRO 6000 Blackwell (sm_120).
          cargo +"$RUST_TOOLCHAIN" build -p cli --features gpu --profile release-thin --target x86_64-unknown-linux-gnu --timings
          cargo +"$RUST_TOOLCHAIN" build -p proof_fixtures --bin fixture-codec --profile release-thin --target x86_64-unknown-linux-gnu --timings
          cp target/x86_64-unknown-linux-gnu/release-thin/cli artifacts/cli
          cp target/x86_64-unknown-linux-gnu/release-thin/fixture-codec artifacts/fixture-codec

      - name: Compile GPU tests
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" test -p gpu_circuit_prover --profile release-thin --target x86_64-unknown-linux-gnu --no-run --timings --message-format=json > test-build.json
          python3 - <<'PYTHON'
          import json, shutil
          with open("test-build.json") as source:
              artifacts = [json.loads(line) for line in source]
          executables = [a["executable"] for a in artifacts
                         if a.get("reason") == "compiler-artifact"
                         and a["target"]["name"] == "gpu_circuit_prover"
                         and a["profile"]["test"] and a.get("executable")]
          assert len(executables) == 1, executables
          shutil.copy2(executables[0], "artifacts/gpu_circuit_prover_tests")
          PYTHON

      - name: GPU crate CPU tests
        env:
          CUDAARCHS: "80;89;90;120"
        run: cargo +$RUST_TOOLCHAIN test -p gpu_execution_prover -p gpu_circuit_prover --profile release-thin --target x86_64-unknown-linux-gnu --lib ::cpu_

      # Real CUDA builds the GPU tests that the no_cuda clippy job in ci.yml leaves out.
      - name: Clippy with CUDA
        env:
          CUDAARCHS: "80"
        run: |
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --target x86_64-unknown-linux-gnu --features "$(python3 .github/scripts/clippy_features.py)"

      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: |
          mkdir -p build-diagnostics
          sccache --show-stats --stats-format=json > build-diagnostics/sccache.json
          sccache --show-stats
          {
            date -u
            for setting in /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events /proc/pressure/cpu; do
              if [ -r "$setting" ]; then
                echo "$setting"
                cat "$setting"
              fi
            done
          } > build-diagnostics/resources-after.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-${{ matrix.ubuntu }}-build-diagnostics
          path: |
            build-diagnostics/
            target/cargo-timings/
          retention-days: 14

      - name: Upload GPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-${{ matrix.ubuntu }}-gpu
          path: artifacts/
          if-no-files-found: error

  zksync-airbender-test:
    runs-on: [ matterlabs-ci-gpu-runner ]
    strategy:
      fail-fast: false
      matrix:
        cuda: [ "13.3.1" ]
        ubuntu: [ "ubuntu26.04" ]
        # Each shard is one GPU runner; the shards run in parallel.
        shard: [ chains, smoke ]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-runtime-${{ matrix.ubuntu }}
      options: --gpus all

    needs: zksync-airbender-build
    steps:
      - name: Prepare environment
        run: |
          echo "/usr/local/nvidia/bin:/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Check Nvidia driver version
        run: |
          nvidia-smi

      - name: Record GPU identity and ECC counters
        continue-on-error: true
        run: nvidia-smi --query-gpu=index,uuid,serial,pci.bus_id,ecc.errors.corrected.volatile.total,ecc.errors.uncorrected.volatile.total,ecc.errors.uncorrected.aggregate.total --format=csv

      - name: Download GPU artifacts
        uses: actions/download-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-${{ matrix.ubuntu }}-gpu
          path: zksync-airbender-gpu/

      - name: Canonical circuit proof parity in both soundness modes
        if: matrix.shard == 'chains'
        shell: bash
        env:
          RUST_MIN_STACK: 1073741824
        run: |
          export AB_TEST_ARTIFACT_ROOT="$GITHUB_WORKSPACE"
          binary=./zksync-airbender-gpu/gpu_circuit_prover_tests
          chmod +x "$binary"
          "$binary" --exact tests::proof_matrix::cpu_canonical_matrix_inventory --test-threads=1 > inventory.txt
          grep -q "test result: ok. 1 passed" inventory.txt
          "$binary" --list --ignored tests::proof_matrix::canonical_ > proof-tests.txt
          mapfile -t tests < <(sed -n 's/: test$//p' proof-tests.txt)
          if [[ "${#tests[@]}" -ne 31 ]]; then
            echo "Expected all 31 canonical circuit/mode tests, found ${#tests[@]}" >&2
            exit 1
          fi
          failed=0
          for test in "${tests[@]}"; do
            timeout 20m "$binary" --exact "$test" --ignored --nocapture --test-threads=1 || failed=1
          done
          exit "$failed"

      - name: Trusted parameter setup caps agree with CPU
        if: matrix.shard == 'chains'
        shell: bash
        run: |
          cli="$GITHUB_WORKSPACE/zksync-airbender-gpu/cli"
          chmod +x "$cli"
          records="$GITHUB_WORKSPACE/trusted-params/basic_fibonacci"
          mkdir -p "$records"
          for mode in pessimistic_conjecture ethproofs_soundcalc; do
            target=recursion-unified
            [[ $mode != pessimistic_conjecture ]] || target=compression
            common=(--bin examples/basic_fibonacci/app.bin --soundness-mode "${mode//_/-}" --target "$target")
            "$cli" trusted-params "${common[@]}" --backend cpu --output "$records/$mode-cpu.json"
            "$cli" trusted-params "${common[@]}" --backend gpu --output "$records/$mode-gpu.json"
            cmp "$records/$mode-cpu.json" "$records/$mode-gpu.json"
            cp "$records/$mode-gpu.json" "$records/${mode//_/-}-trusted-params.json"
          done

      - name: Program-proof chain parity in both soundness modes
        if: matrix.shard == 'chains'
        shell: bash
        env:
          FIXTURE_BACKEND: gpu
          RUST_MIN_STACK: 1073741824
        run: |
          export FIXTURE_CLI="$GITHUB_WORKSPACE/zksync-airbender-gpu/cli"
          export FIXTURE_CODEC="$GITHUB_WORKSPACE/zksync-airbender-gpu/fixture-codec"
          export FIXTURE_TRUSTED_PARAMS="$GITHUB_WORKSPACE/trusted-params/basic_fibonacci"
          chmod +x "$FIXTURE_CLI" "$FIXTURE_CODEC"
          failed=0
          for mode in pessimistic_conjecture ethproofs_soundcalc; do
            stages=(base_unified unrolled)
            if [[ $mode == pessimistic_conjecture ]]; then
              stages+=(compression l1)
            fi
            for stage in "${stages[@]}"; do
              fixtures/regenerate.sh --check --mode "$mode" --stage "$stage" || failed=1
            done
          done
          exit "$failed"

      - name: Prove, continue and verify on GPU in every soundness mode
        if: matrix.shard == 'smoke'
        env:
          # The lowest allowed switch threshold (MIN_UNIFIED_SWITCH_CYCLES): unrolled recursion runs while
          # the estimated verifier cost stays at or above it. EXPECT_UNROLLED checks that this workload
          # proves an unrolled layer in every mode.
          RECURSION_UNIFIED_SWITCH_CYCLES: "16777216"
          INPUT_FILE: output/hashed_fibonacci_input.txt
          DIRECT: "1"
          EXPECT_UNROLLED: "1"
        run: |
          chmod +x zksync-airbender-gpu/cli
          mkdir -p output
          printf '0000000f00124f80' > "$INPUT_FILE"
          .github/scripts/soundness_mode_smoke.sh zksync-airbender-gpu/cli \
            examples/hashed_fibonacci/app.bin gpu

      - name: Record GPU identity and ECC counters after a failure
        if: failure()
        continue-on-error: true
        run: nvidia-smi --query-gpu=index,uuid,serial,pci.bus_id,ecc.errors.corrected.volatile.total,ecc.errors.uncorrected.volatile.total,ecc.errors.uncorrected.aggregate.total --format=csv

  # Keep branch protection tied to one stable GPU check name while GPU
  # coverage spans several jobs and matrix shards.
  gpu-checks:
    name: gpu-checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - zksync-airbender-build
      - zksync-airbender-test
    steps:
      - name: Decide on GPU checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
