name: Test on GPU

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  zksync-airbender-build:
    runs-on: [ matterlabs-ci-runner-highmem ]
    strategy:
      fail-fast: false
      matrix:
        cuda: [ "13.3.1" ]
        ubuntu: [ "ubuntu26.04" ]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-${{ matrix.ubuntu }}
    env:
      RUST_TOOLCHAIN: nightly-2026-08-09
      RUST_MIN_STACK: 16777216
    steps:
      - name: Prepare environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update && apt install -y cmake git libssl-dev pkg-config wget curl python3
          echo "/usr/local/nvidia/bin:/usr/local/cuda/bin" >> $GITHUB_PATH

      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Setup rustup
        run: |
          wget -q -O - https://sh.rustup.rs | bash -s -- -y --default-toolchain $RUST_TOOLCHAIN --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          echo "export PATH=\"$HOME/.cargo/bin:\$PATH\"" >> "${HOME}/.bash_profile"

      # we need cmake 3.30 (as 3.24 doesn't properly pass cuda_standard_20)
      - name: Setup CMAKE
        run: |
          curl -LO https://github.com/Kitware/CMake/releases/download/v3.30.2/cmake-3.30.2-linux-x86_64.sh && \
            chmod +x cmake-3.30.2-linux-x86_64.sh && \
            ./cmake-3.30.2-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Check CUDA version
        run: |
          nvcc --version

      - name: GPU test serialization drift guard
        run: cargo +$RUST_TOOLCHAIN test -p gpu_core --release --target x86_64-unknown-linux-gnu cpu_nextest_config_covers_all_gpu_crates

      - name: Build CLI and compile GPU tests
        shell: bash
        run: |
          mkdir artifacts
          # Build for A100 (sm_80), L4 (sm_89), H100 (sm_90), and RTX PRO 6000 Blackwell (sm_120).
          CUDAARCHS="80;89;90;120" \
          cargo +$RUST_TOOLCHAIN build -p cli --features gpu --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/cli artifacts/cli
          CUDAARCHS="80;89;90;120" \
          cargo +$RUST_TOOLCHAIN test -p gpu_circuit_prover --release --target x86_64-unknown-linux-gnu --no-run --message-format=json > test-build.json
          python3 - <<'PYTHON'
          import json, shutil
          with open("test-build.json") as source:
              artifacts = [json.loads(line) for line in source]
          executables = [a["executable"] for a in artifacts
                         if a.get("reason") == "compiler-artifact"
                         and a["target"]["name"] == "gpu_circuit_prover"
                         and a["profile"]["test"] and a.get("executable")]
          assert len(executables) == 1, executables
          shutil.copy2(executables[0], "artifacts/gpu_circuit_prover_tests")
          PYTHON

      - name: Upload GPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-${{ matrix.ubuntu }}-gpu
          path: artifacts/
          if-no-files-found: error

  zksync-airbender-test:
    runs-on: [ matterlabs-ci-gpu-runner ]
    strategy:
      fail-fast: false
      matrix:
        cuda: [ "13.3.1" ]
        ubuntu: [ "ubuntu26.04" ]
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-runtime-${{ matrix.ubuntu }}
      options: --gpus all

    needs: zksync-airbender-build
    steps:
      - name: Prepare environment
        run: |
          echo "/usr/local/nvidia/bin:/usr/local/cuda/bin" >> $GITHUB_PATH

      - uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8 # v3

      - name: Check Nvidia driver version
        run: |
          nvidia-smi

      - name: Download GPU artifacts
        uses: actions/download-artifact@v4
        with:
          name: zksync-airbender-${{ matrix.cuda }}-${{ matrix.ubuntu }}-gpu
          path: zksync-airbender-gpu/

      - name: Circuit proof parity with multiple scheduled proofs
        shell: bash
        env:
          RUST_MIN_STACK: 1073741824
        run: |
          export AB_TEST_ARTIFACT_ROOT="$GITHUB_WORKSPACE"
          binary=./zksync-airbender-gpu/gpu_circuit_prover_tests
          chmod +x "$binary"
          "$binary" --list --ignored multi_schedule --skip run_mixed_circuit_multi_schedule_test > proof-tests.txt
          mapfile -t tests < <(sed -n 's/: test$//p' proof-tests.txt)
          if [[ "${#tests[@]}" -ne 12 ]]; then
            echo "Expected all 12 circuit tests, found ${#tests[@]}" >&2
            exit 1
          fi
          failed=0
          for test in "${tests[@]}"; do
            timeout 20m "$binary" --exact --ignored "$test" --nocapture || failed=1
          done
          exit "$failed"

      - name: Prove recursion unified on GPU
        run: |
          chmod +x zksync-airbender-gpu/cli
          zksync-airbender-gpu/cli prove \
            --bin examples/hashed_fibonacci/app.bin \
            --input-file examples/hashed_fibonacci/input.txt \
            --target recursion-unified \
            --backend gpu \
            --output-dir output \
            --output-file proof.json

      - name: Verify recursion unified proof
        run: |
          zksync-airbender-gpu/cli verify \
            --proof output/proof.json \
            --bin examples/hashed_fibonacci/app.bin

  # Keep branch protection tied to one stable GPU check name even if we
  # split GPU coverage across multiple jobs or matrix entries later on.
  gpu-checks:
    name: gpu-checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - zksync-airbender-build
      - zksync-airbender-test
    steps:
      - name: Decide on GPU checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
