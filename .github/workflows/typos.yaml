name: Codespell

on: pull_request

permissions: read-all

jobs:
  typos:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=d -z "$BASE_SHA"...HEAD \
            | python3 -c 'import sys; paths = [p for p in sys.stdin.buffer.read().split(b"\0") if p and p != b"SECURITY.md" and not p.endswith((b".json", b".lock", b".bin", b".elf", b".pdf", b".png", b".text", b".bak", b".svg"))]; sys.stdout.buffer.write(b"\0".join(paths) + (b"\0" if paths else b""))' \
            > "$RUNNER_TEMP/typos-files"
          if [[ -s "$RUNNER_TEMP/typos-files" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install typos and check its configuration
        if: steps.changed.outputs.any == 'true'
        uses: crate-ci/typos@v1
        with:
          files: .github/typos.toml
          config: ./.github/typos.toml

      - name: Check changed files in batches
        if: steps.changed.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xargs -0 -r -n 64 "$RUNNER_TEMP/typos" --force-exclude --config ./.github/typos.toml -- < "$RUNNER_TEMP/typos-files"
