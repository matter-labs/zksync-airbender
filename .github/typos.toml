[files]
extend-exclude = [
    "*.json",
    "*.lock",
    "*.bin",
    "*.elf",
    "*.pdf",
    "*.png",
    "*.text",
    "*.bak",
    "*.svg",
    ".git/",
    "SECURITY.md",
    # Keep the pinned upstream document unchanged.
    "cs_formal_verification/docs/airbender/00-master.md"
]

[default.extend-words]
ND = "ND"
nd = "nd"
ba = "ba"
pn = "pn"
sie = "sie"
Sie = "Sie"
tou = "tou"
leafs = "leafs"
LEAFS = "LEAFS"
INOT = "INOT"
inot = "inot"
ot = "ot"
optin = "optin"
Optin = "Optin"
setp = "setp" # PTX set-predicate instruction.
# Proof terms also occur in generator strings and Markdown code blocks.
hom = "hom" # Ring homomorphisms.
Hom = "Hom"
thm = "thm" # Lean declaration constructors.
ue = "ue" # Sail exception type argument.
hel = "hel" # Lean hypothesis names.
henc = "henc"

[type.asm.extend-words]
Wich = "Wich"
TRE = "TRE"

[type.lean]
extend-glob = ["*.lean"]

[type.lean.extend-words]
Alo = "Alo" # Low limb of word A.
NTO = "NTO" # Sail non-timeout wait reason.
iz = "iz" # Index-zero proof names and generated Sail identifiers.
Iz = "Iz"

[type.sail]
extend-glob = ["*.sail"]

[type.sail.extend-words]
nto = "nto" # Non-timeout wait configuration.
