name: "Lean formal verification setup"
description: >-
  The setup half of the Lean CI jobs (cs_formal_verification/ci/lean-ci.sh): packages, elan and the toolchain, the
  generated Sail model, lean-sail, the dependency checkouts and Mathlib's prebuilt files, each restored from its
  cache when possible. Expects the repository checked out.
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cs_formal_verification/ci/lean-ci.sh deps
        python3 cs_formal_verification/ci/test_sail_drift.py

    - name: Restore elan
      uses: actions/cache@v4
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cs_formal_verification/lean/lean-toolchain') }}
    - name: Install elan and the Lean toolchain
      shell: bash
      run: |
        cs_formal_verification/ci/lean-ci.sh elan
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    # The generated Sail model is committed. Regenerate it when
    # one of its inputs changes (the key hashes them all); otherwise restored.
    - name: Sail model cache key
      id: sail
      shell: bash
      run: echo "key=sail-model-$(cs_formal_verification/ci/lean-ci.sh sail-key)" >> "$GITHUB_OUTPUT"
    - name: Restore the Sail drift receipt
      id: sail-cache
      uses: actions/cache/restore@v4
      with:
        path: /tmp/sail-drift-receipt
        key: ${{ steps.sail.outputs.key }}-${{ hashFiles('cs_formal_verification/lean/sail-rv32/SailRV32.lean', 'cs_formal_verification/lean/sail-rv32/SailRV32/**/*.lean', 'cs_formal_verification/lean/sail-rv32/*LICENSE') }}
    - name: Generate the Sail model (sail/regen.sh --bootstrap-sail)
      if: steps.sail-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cs_formal_verification/ci/lean-ci.sh sail-deps
        cs_formal_verification/ci/lean-ci.sh time sail-gen
        touch /tmp/sail-drift-receipt
    - name: Save the Sail drift receipt
      if: steps.sail-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /tmp/sail-drift-receipt
        key: ${{ steps.sail.outputs.key }}-${{ hashFiles('cs_formal_verification/lean/sail-rv32/SailRV32.lean', 'cs_formal_verification/lean/sail-rv32/SailRV32/**/*.lean', 'cs_formal_verification/lean/sail-rv32/*LICENSE') }}
    - name: Fetch lean-sail (pinned; not cached, no upstream licence)
      shell: bash
      run: cs_formal_verification/ci/lean-ci.sh time lean-sail

    # Mathlib's compressed files for the modules the build imports (0.22 GB) and the cache tool binary
    # (ci/lean-ci.sh mathlib): without them ~3100 files are fetched one by one and the tool is rebuilt.
    - name: Restore the Mathlib downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/mathlib
        key: mathlib-${{ hashFiles('cs_formal_verification/lean/lake-manifest.json') }}
    # The dependencies' git checkouts (sources and .git, no build outputs; 0.6 GB zstd, Mathlib's history most of it):
    # without them Lake clones them on every run (5-6 min of the Mathlib step in the container).
    - name: Restore the dependency checkouts
      uses: actions/cache@v4
      with:
        path: |
          cs_formal_verification/lean/.lake/packages
          !cs_formal_verification/lean/.lake/packages/*/.lake
        key: lake-packages-${{ hashFiles('cs_formal_verification/lean/lake-manifest.json') }}
    - name: Mathlib cache (lake exe cache get)
      shell: bash
      run: cs_formal_verification/ci/lean-ci.sh time mathlib
