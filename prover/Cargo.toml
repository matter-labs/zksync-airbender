[package]
name = "prover"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
field = { workspace = true, default-features = false }
worker = { workspace = true, optional = true }
common_constants = { workspace = true }
unroll = { workspace = true}
seq-macro = { workspace = true, optional = true }
fft = { workspace = true, optional = true }
cs = { workspace = true, default-features = false }
blake2s_u32 = { workspace = true, default-features = false }
serde = { workspace = true }
serde-big-array = "*"
transcript = { workspace = true }
non_determinism_source = { workspace = true }
riscv_transpiler = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }

proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
serde_json = { version = "*", optional = true }
bincode = { version = "1.3", optional = true }
serde_with = { version = "*", optional = true }

[dev-dependencies]
test_utils = { workspace = true }
rand = { workspace = true, features = ["std", "thread_rng", "std_rng"]}
bincode = { version = "1.3" }
criterion = "0.5"
hex = "*"
serial_test = "3"
proptest = "1"

[[bench]]
name = "pow_bench"
harness = false

[features]
prover = ["worker", "seq-macro", "fft", "cs/compiler", "transcript/pow", "riscv_transpiler", "proc-macro2", "quote", "serde_json", "serde_with", "itertools"]
deterministic_pow = ["transcript/deterministic_pow"]
# Print logs related to timings only.
timing_logs = []
# Will evaluate quotient on main domain for satisfiability checks
debug_satisfiable = []
# self-checks (logup identity, cache verification, claim verification, whir consistency)
gkr_self_checks = []
gkr_check_satisfied = []
# When set, prover tests load no-caches circuit variants
no_caches = []
# When set, WHIR intermediate-oracle leaves are committed in evaluation form
# (the pre-coefficient-encoding behavior). Default (feature off) is coefficient form.
eval_leaves = []
verifier_stats = ["non_determinism_source/verifier_stats"]
# Will perform witness evaluation in synthesis functions
cs_debug = ["cs/debug_evaluate_witness"]
# Print detailed debug logs
debug_logs = ["timing_logs", "cs/debug_logs"]
profiling = ["debug_logs"]
default = ["prover", "cs_debug", "bincode"]

# Include test code for test in dependent crates
test = []
